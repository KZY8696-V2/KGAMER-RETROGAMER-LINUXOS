name: Build RETROGAMER AMD64 Bootable ISO Image (Final Fix)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-amd64-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Up Last 10 Failed Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          echo "Checking and cleaning up to 10 oldest failed workflow runs..."
          REPO="${{ github.repository }}"
          
          for run_id in $(gh api repos/$REPO/actions/runs --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' | tail -n 10); do
              echo "Deleting failed run ID: $run_id"
              gh api --method DELETE repos/$REPO/actions/runs/$run_id || true
          done
          echo "Failed runs cleanup completed."

      - name: Install ISO Building Dependencies
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          rm -f /etc/apt/sources.list.d/microsoft*
          rm -f /etc/apt/trusted.gpg.d/microsoft*

          apt-get update
          apt-get install -y debootstrap squashfs-tools genisoimage xorriso libisoburn1 mtools dosfstools wget curl unzip zip e2fsprogs fdisk gdisk jstest-gtk joy2key xboxdrv git libfuse2 syslinux syslinux-common syslinux-utils

      - name: Build AMD64 Debian Bookworm Live ISO System (System Monitor & Global Config)
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          DEBIAN_CODENAME="bookworm"
          echo "=== RETROGAMER AMD64 LIVE ISO BUILD STARTED (FINAL FIX) ==="

          mkdir -p iso_root/live iso_root/isolinux
          mkdir -p mnt

          # Debootstrap ile Debian 12 Bookworm Temel Sistemi Kurma
          echo "Bootstrapping Debian $DEBIAN_CODENAME AMD64 for ISO..."
          debootstrap --arch=amd64 "$DEBIAN_CODENAME" mnt http://deb.debian.org/debian/

          mount -t proc proc mnt/proc
          mount -t sysfs sysfs mnt/sys
          mount --bind /dev mnt/dev
          mount --bind /dev/pts mnt/dev/pts

          # --- 1. KULLANICI OLUŞTURMA VE TÜM DİL/KLAVYE PAKETLERİNİN KURULUMU ---
          chroot mnt bash -c "
          export DEBIAN_FRONTEND=noninteractive
          id -u kgamer &>/dev/null || useradd -m -s /bin/bash -G sudo,audio,video,input,games kgamer
          echo 'kgamer:kgamer' | chpasswd
          echo 'root:root' | chpasswd
          mkdir -p /home/kgamer
          chown -R kgamer:kgamer /home/kgamer

          apt-get update
          apt-get install -y --no-install-recommends \
              dialog locales locales-all console-setup keyboard-configuration xkb-data \
              git wget curl unzip xfce4-panel xfce4-terminal openbox xorg xserver-xorg \
              pcmanfm chromium libpcre2-8-0 jstest-gtk joy2key xboxdrv \
              bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant \
              desktop-file-utils libgdk-pixbuf-2.0-0 libgtk-3-0 \
              libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g \
              libcairo2 libpango-1.0-0 libdrm2 shared-mime-info libfuse2 \
              syslinux syslinux-common syslinux-utils linux-image-amd64 systemd-sysv sudo live-boot live-config ca-certificates
          "

          # --- 2. RETROPIE İLK KURULUMU ---
          chroot mnt bash -c '
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /opt/kgamer
          cd /opt/kgamer
          if [ ! -d "RetroPie-Setup" ]; then
              git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup || true
          fi
          cd RetroPie-Setup
          export YES=1
          ./retropie_packages.sh core setup_packages < /dev/null || true
          ./retropie_packages.sh essentials < /dev/null || true
          ./retropie_packages.sh emulationstation install < /dev/null || true
          ./retropie_packages.sh retroarch install < /dev/null || true
          ' || true

          # --- GELİŞMİŞ GAMEPAD HELPER ---
          mkdir -p mnt/opt/kgamer
          tee mnt/opt/kgamer/gamepad-helper.sh << 'EOF' > /dev/null
          #!/bin/bash
          export TERM=linux
          if pgrep -x "joy2key" > /dev/null; then
              exit 0
          fi
          
          JS_DEV=""
          if [ -e /dev/input/js0 ]; then
              JS_DEV="/dev/input/js0"
          elif [ -e /dev/input/js1 ]; then
              JS_DEV="/dev/input/js1"
          fi

          if [ -n "$JS_DEV" ]; then
              joy2key -dev "$JS_DEV" -keys 0x1c 0x1c 0x01 0x01 &>/dev/null &
          fi
          EOF
          chmod +x mnt/opt/kgamer/gamepad-helper.sh

          chroot mnt bash -c '
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /opt/kgamer/apps
          mkdir -p /opt/kgamer/backup_apps
          mkdir -p /home/kgamer/RetroPie/roms/apps
          mkdir -p /home/kgamer/RetroPie/roms/games
          mkdir -p /home/kgamer/RetroPie/roms/ports

          cat << "EOF" > /opt/kgamer/apps/terminal.desktop
          [Desktop Entry]
          Name=XFCE Terminal
          Comment=Command Line Terminal
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Terminal=false
          Type=Application
          Categories=System;Application;
          EOF

          cat << "EOF" > /opt/kgamer/apps/chromium.desktop
          [Desktop Entry]
          Name=Chromium Browser
          Comment=Web Browser
          Exec=chromium --no-sandbox
          Icon=web-browser
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          cat << "EOF" > /opt/kgamer/apps/pcmanfm.desktop
          [Desktop Entry]
          Name=File Manager (PCManFM)
          Comment=Browse Files
          Exec=pcmanfm
          Icon=system-file-manager
          Terminal=false
          Type=Application
          Categories=System;
          EOF

          cp -f /opt/kgamer/apps/*.desktop /opt/kgamer/backup_apps/ 2>/dev/null || true
          chown -R kgamer:kgamer /home/kgamer/RetroPie 2>/dev/null || true
          '

          # --- 3. SİSTEM MONİTÖRÜ SCRIPTİ ---
          tee mnt/opt/kgamer/system-dashboard.sh << 'EOF' > /dev/null
          #!/bin/bash
          export TERM=linux
          if [ -f /opt/kgamer/gamepad-helper.sh ]; then
              /opt/kgamer/gamepad-helper.sh
          fi

          while true; do
              if command -v vcgencmd &> /dev/null; then
                  cpu_temp=$(vcgencmd measure_temp | awk -F= '{print $2}')
              else
                  cpu_temp=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk '{printf "%.1f C", $1/1000}')
                  [ -z "$cpu_temp" ] && cpu_temp="N/A"
              fi

              cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print 100 - $8"%"}')
              [ -z "$cpu_usage" ] && cpu_usage="N/A"
              cpu_cores=$(nproc 2>/dev/null || echo "N/A")
              cpu_model=$(grep -m 1 "model name" /proc/cpuinfo | cut -d ':' -f2 | xargs)
              [ -z "$cpu_model" ] && cpu_model="Generic x86_64 Processor"

              if [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq ]; then
                  cpu_freq=$(awk '{printf "%.0f MHz", $1/1000}' /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq)
              else
                  cpu_freq="N/A"
              fi

              gpu_info=$(lspci 2>/dev/null | grep -i vga | cut -d ':' -f3 | xargs)
              [ -z "$gpu_info" ] && gpu_info="Standard VGA / Integrated GPU"

              ram_info=$(free -h | grep Mem)
              ram_total=$(echo "$ram_info" | awk '{print $2}')
              ram_used=$(echo "$ram_info" | awk '{print $3}')
              ram_free=$(echo "$ram_info" | awk '{print $4}')

              disk_info=$(df -h / | tail -n 1)
              disk_total=$(echo "$disk_info" | awk '{print $2}')
              disk_used=$(echo "$disk_info" | awk '{print $3}')
              disk_avail=$(echo "$disk_info" | awk '{print $4}')
              disk_pct=$(echo "$disk_info" | awk '{print $5}')

              uptime_str=$(uptime -p)

              dialog --clear --title "RETROGAMER - HARDWARE SYSTEM MONITOR" \
                  --msgbox "ISLEMCI (CPU) BILGILERI
          Model         : $cpu_model
          Cekirdek      : $cpu_cores Adet
          Kullanim      : $cpu_usage
          Frekans       : $cpu_freq
          Sicaklik      : $cpu_temp

          GRAFIK KARTI (GPU) BILGISI
          Model         : $gpu_info

          BELLEK (RAM) DURUMU
          Toplam        : $ram_total
          Kullanilan    : $ram_used
          Bosta         : $ram_free

          DEPOLAMA (DISK) DURUMU
          Toplam        : $disk_total
          Kullanilan    : $disk_used ($disk_pct)
          Kalan Bosta   : $disk_avail

          CALISMA SURESI
          Uptime        : $uptime_str" 24 70
              break
          done
          EOF
          chmod +x mnt/opt/kgamer/system-dashboard.sh

          # --- 4. KONTROL MERKEZİ SCRIPTİ (`kgamer-setup.sh`) ---
          tee mnt/opt/kgamer/kgamer-setup.sh << 'EOF' > /dev/null
          #!/bin/bash
          if [ "$EUID" -ne 0 ]; then
              exit 1
          fi

          if [ -f /opt/kgamer/gamepad-helper.sh ]; then
              /opt/kgamer/gamepad-helper.sh
          fi

          APPS_DIR="/opt/kgamer/apps"
          BACKUP_APPS_DIR="/opt/kgamer/backup_apps"

          configure_keyboard_layout() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              dpkg-reconfigure keyboard-configuration
              setupcon --force
              dialog --msgbox "Keyboard layout configuration updated successfully!" 5 50
          }

          configure_locale_and_language() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              dpkg-reconfigure locales
              dialog --msgbox "System language/locale updated successfully!" 5 50
          }

          configure_hostname() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              CURRENT_HOST=$(cat /etc/hostname 2>/dev/null || echo "retrogamer")
              NEW_HOST=$(dialog --clear --title "CHANGE HOSTNAME (MAKİNE ADI)" \
                  --inputbox "Enter new system hostname:" 8 50 "$CURRENT_HOST" 3>&1 1>&2 2>&3)
              if [ -n "$NEW_HOST" ]; then
                  hostnamectl set-hostname "$NEW_HOST"
                  echo "$NEW_HOST" > /etc/hostname
                  sed -i "s/127.0.1.1.*/127.0.1.1\t$NEW_HOST/g" /etc/hosts || true
                  dialog --msgbox "Hostname successfully changed to '$NEW_HOST'!" 5 50
              fi
          }

          scan_and_manage_gamepads() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              start_time=$(date +%s)
              
              while true; do
                  current_time=$(date +%s)
                  elapsed=$((current_time - start_time))
                  mins=$((elapsed / 60))
                  secs=$((elapsed % 60))
                  time_str=$(printf "%02d:%02d" $mins $secs)

                  found_pads=""
                  index=1
                  declare -A pad_paths
                  for js in /dev/input/js*; do
                      if [ -e "$js" ]; then
                          pad_name=$(cat /sys/class/input/$(basename $js)/device/name 2>/dev/null || echo "Gamepad $index")
                          found_pads="$found_pads $index \"$pad_name ($js)\" ON"
                          pad_paths[$index]="$js"
                          index=$((index + 1))
                      fi
                  done

                  if [ -z "$found_pads" ]; then
                      timeout 5 dialog --clear --title "RETROGAMER - GAMEPAD MANAGER (Süre: $time_str)" \
                          --msgbox "No gamepads connected. Searching continuously...\n(Press ESC or Enter to access menu / Stop)" 8 55
                      ret_val=$?
                      if [ $ret_val -ne 0 ]; then
                          break
                      fi
                  else
                      exec 3>&1
                      SUB_CHOICE=$(eval dialog --clear --title "RETROGAMER - GAMEPAD MANAGER (Süre: $time_str)" \
                          --menu "Connected gamepads found. Select to Disconnect/Unpair or Rescan:" 16 70 7 \
                          "REFRESH" "🔄 Rescan / Refresh List" \
                          "DISCONNECT" "🔌 Disconnect / Kill Gamepad Connection" \
                          "BACK" "🔙 Return to Main Menu" \
                          $found_pads 2>&1 3>&-);
                      ret_val=$?
                      exec 3>&-

                      if [ $ret_val -ne 0 ] || [ "$SUB_CHOICE" = "BACK" ]; then
                          break
                      elif [ "$SUB_CHOICE" = "REFRESH" ]; then
                          continue
                      elif [ "$SUB_CHOICE" = "DISCONNECT" ]; then
                          exec 3>&1
                          TARGET_PAD=$(eval dialog --clear --title "DISCONNECT GAMEPAD" \
                              --menu "Select gamepad to disconnect:" 12 60 4 $found_pads 2>&1 3>&-);
                          exec 3>&-
                          
                          if [ -n "$TARGET_PAD" ] && [ -n "${pad_paths[$TARGET_PAD]}" ]; then
                              target_js="${pad_paths[$TARGET_PAD]}"
                              pkill -f "joy2key.*$target_js" || true
                              mac_addr=$(cat /sys/class/input/$(basename $target_js)/device/address 2>/dev/null || true)
                              if [ -n "$mac_addr" ]; then
                                  bluetoothctl disconnect "$mac_addr" &>/dev/null || true
                              else
                                  bluetoothctl disconnect &>/dev/null || true
                              fi
                              dialog --msgbox "Gamepad disconnected successfully!" 5 45
                          fi
                      fi
                  fi
              done
          }

          wifi_manager_menu() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              start_time=$(date +%s)

              while true; do
                  current_time=$(date +%s)
                  elapsed=$((current_time - start_time))
                  mins=$((elapsed / 60))
                  secs=$((elapsed % 60))
                  time_str=$(printf "%02d:%02d" $mins $secs)

                  current_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
                  [ -z "$current_ip" ] && current_ip="Not Connected (No IP)"

                  WIFI_ACTION=$(dialog --clear --title "RETROGAMER - WIFI MANAGER (Süre: $time_str)" \
                      --menu "Current IP: $current_ip\nSelect Wi-Fi Action:" 18 65 7 \
                      "1" "📡 Scan & Connect Wi-Fi (Continuous Auto-Scan)" \
                      "2" "🔍 View Current IP Address" \
                      "3" "❌ Disconnect / Forget Wi-Fi Connection" \
                      "4" "🔙 Return to Main Menu" 3>&1 1>&2 2>&3)

                  case $WIFI_ACTION in
                      1)
                          wifi_list=""
                          if command -v nmcli &> /dev/null; then
                              nmcli dev wifi rescan &>/dev/null || true
                              while IFS= read -r line; do
                                  ssid=$(echo "$line" | awk -F: '{print $2}' | xargs)
                                  [ -n "$ssid" ] && wifi_list="$wifi_list \"$ssid\" \"Signal: $(echo $line | awk -F: '{print $6}')%\""
                              done < <(nmcli -t -f SSID,SIGNAL,SECURITY dev wifi list | grep -v '^--')
                          fi

                          if [ -z "$wifi_list" ]; then
                              timeout 5 dialog --clear --title "WIFI SCAN (Süre: $time_str)" \
                                  --msgbox "No Wi-Fi networks found or scanning...\n(Timeout active, will retry continuously)" 7 50
                          else
                              exec 3>&1
                              CHOSEN_SSID=$(eval dialog --clear --title "AVAILABLE WIFI NETWORKS" \
                                  --menu "Select network to connect automatically:" 15 60 6 $wifi_list 2>&1 3>&-);
                              ret_val=$?
                              exec 3>&-

                              if [ $ret_val -eq 0 ] && [ -n "$CHOSEN_SSID" ]; then
                                  WIFI_PASS=$(dialog --clear --title "WIFI PASSWORD" \
                                      --passwordbox "Enter password for '$CHOSEN_SSID':" 8 50 3>&1 1>&2 2>&3)
                                  if [ -n "$WIFI_PASS" ]; then
                                      nmcli dev wifi connect "$CHOSEN_SSID" password "$WIFI_PASS" &>/dev/null || \
                                      sudo nmcli dev wifi connect "$CHOSEN_SSID" password "$WIFI_PASS" &>/dev/null || true
                                      dialog --msgbox "Attempted connection to '$CHOSEN_SSID'!" 5 50
                                  fi
                              fi
                          fi
                          ;;
                      2)
                          dialog --msgbox "Current Device IP Address:\n$current_ip" 6 40
                          ;;
                      3)
                          if command -v nmcli &> /dev/null; then
                              active_conn=$(nmcli -t -f NAME,TYPE connection show --active | grep wireless | cut -d: -f1)
                              if [ -n "$active_conn" ]; then
                                  nmcli connection down "$active_conn" &>/dev/null || true
                                  nmcli connection delete "$active_conn" &>/dev/null || true
                              else
                                  nmcli dev disconnect wlan0 &>/dev/null || true
                              fi
                          fi
                          dialog --msgbox "Wi-Fi connection disconnected and forgotten successfully!" 6 50
                          ;;
                      4|*)
                          break
                          ;;
                  esac
              done
          }

          create_new_user_account() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              while true; do
                  NEW_USER=$(dialog --clear --title "NEW USER SETUP (MANDATORY)" \
                      --inputbox "Enter new username (Cannot be empty):" 8 50 3>&1 1>&2 2>&3)
                  [ -z "$NEW_USER" ] && continue
                  
                  if id "$NEW_USER" &>/dev/null; then
                      dialog --msgbox "User '$NEW_USER' already exists! Choose another name." 6 50
                      continue
                  fi
                  break
              done

              while true; do
                  NEW_PASS=$(dialog --clear --title "NEW USER PASSWORD (MANDATORY)" \
                      --passwordbox "Enter password for $NEW_USER (Cannot be empty):" 8 50 3>&1 1>&2 2>&3)
                  [ -z "$NEW_PASS" ] && continue
                  break
              done

              useradd -m -s /bin/bash -G sudo,audio,video,input,games "$NEW_USER" 2>/dev/null
              echo "$NEW_USER:$NEW_PASS" | chpasswd
              dialog --msgbox "User '$NEW_USER' created successfully!" 5 45
          }

          edit_existing_user() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              while true; do
                  TARGET_USER=$(dialog --clear --title "EDIT USER (MANDATORY)" \
                      --inputbox "Enter existing username to edit (e.g., kgamer):" 8 50 "kgamer" 3>&1 1>&2 2>&3)
                  [ -z "$TARGET_USER" ] && continue
                  
                  if id "$TARGET_USER" &>/dev/null; then
                      break
                  else
                      dialog --msgbox "User '$TARGET_USER' not found! Try again." 5 45
                  fi
              done

              ACTION=$(dialog --clear --title "Edit User: $TARGET_USER" \
                  --menu "Select option:" 12 50 2 \
                  "1" "Change Username" \
                  "2" "Change Password" 3>&1 1>&2 2>&3)
              
              if [ "$ACTION" = "1" ]; then
                  while true; do
                      NEW_NAME=$(dialog --clear --title "CHANGE USERNAME" \
                          --inputbox "Enter new username for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
                      [ -z "$NEW_NAME" ] && continue
                      usermod -l "$NEW_NAME" "$TARGET_USER" 2>/dev/null
                      dialog --msgbox "Username changed to '$NEW_NAME' successfully!" 5 50
                      break
                  done
              elif [ "$ACTION" = "2" ]; then
                  while true; do
                      NEW_P=$(dialog --clear --title "CHANGE PASSWORD" \
                          --passwordbox "Enter new password for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
                      [ -z "$NEW_P" ] && continue
                      echo "$TARGET_USER:$NEW_P" | chpasswd
                      dialog --msgbox "Password updated successfully!" 5 40
                      break
                  done
              fi
          }

          change_root_password() {
              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi
              ROOT_P=$(dialog --passwordbox "Enter new ROOT password:" 8 50 3>&1 1>&2 2>&3)
              if [ -n "$ROOT_P" ]; then
                  echo "root:$ROOT_P" | chpasswd
                  dialog --msgbox "Root password updated successfully!" 5 45
              fi
          }

          start_desktop_environment() {
              clear
              echo "[+] Openbox ve Alttaki XFCE Paneli başlatılıyor..."
              export DISPLAY=:0
              xfconf-query -c xfce4-panel -p /panels/panel-1/position -s "p=8;x=0;y=0" --create -t string 2>/dev/null || true
              xfce4-panel --display=:0 &
              exec openbox-session
          }

          run_retropie_setup() {
              clear
              echo "[+] RetroPie Setup Script açılıyor..."
              cd /opt/kgamer/RetroPie-Setup
              sudo ./retropie_packages.sh
              echo ""
              read -p "Press Enter to return to RETROGAMER Control Center..."
          }

          component_manager_menu() {
              while true; do
                  COMP_CHOICE=$(dialog --clear --title "COMPONENT REINSTALLER (NO REMOVAL ALLOWED)" \
                      --menu "Select a component to REINSTALL / REFRESH safely:" 20 65 10 \
                      "1" "🔄 Reinstall RetroPie & Setup Script (GitHub Update)" \
                      "2" "📦 Reinstall Desktop Environment (XFCE Panel, Openbox, Xorg)" \
                      "3" "🌐 Reinstall Web & File Tools (Chromium, PCManFM)" \
                      "4" "🎮 Reinstall Gamepad & Input Helpers (joy2key, xboxdrv, jstest-gtk)" \
                      "5" "📶 Reinstall Connectivity Tools (Bluez, Network-Manager, Wpasupplicant)" \
                      "6" "🛠️ Reinstall System Utilities & CLI Tools (dialog, git, wget, curl, unzip, FUSE)" \
                      "7" "⚙️ Reinstall Core Libraries & Fonts (libpng, freetype, zlib, cairo, pango)" \
                      "8" "📦 Reinstall ALL Base Packages (Full Safe APT Reinstall)" \
                      "9" "🔙 Return to Main Control Center" 3>&1 1>&2 2>&3)
                  
                  case $COMP_CHOICE in
                      1)
                          clear
                          echo "=== Reinstalling & Refreshing RetroPie Setup & Core Packages ==="
                          cd /opt/kgamer
                          rm -rf RetroPie-Setup
                          git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup
                          cd RetroPie-Setup
                          export YES=1
                          export DEBIAN_FRONTEND=noninteractive
                          sudo ./retropie_packages.sh core setup_packages < /dev/null || true
                          sudo ./retropie_packages.sh essentials < /dev/null || true
                          sudo ./retropie_packages.sh emulationstation install < /dev/null || true
                          sudo ./retropie_packages.sh retroarch install < /dev/null || true
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      2)
                          clear
                          echo "=== Reinstalling Desktop Environments (XFCE & Openbox) ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y xfce4-panel xfce4-terminal openbox xorg xserver-xorg desktop-file-utils
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      3)
                          clear
                          echo "=== Reinstalling Chromium & PCManFM ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y chromium pcmanfm
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      4)
                          clear
                          echo "=== Reinstalling Gamepad & Input Helpers ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y joy2key xboxdrv jstest-gtk
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      5)
                          clear
                          echo "=== Reinstalling Network & Bluetooth Tools ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      6)
                          clear
                          echo "=== Reinstalling System Utilities & CLI Tools ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y dialog git wget curl unzip console-setup libfuse2 sudo
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      7)
                          clear
                          echo "=== Reinstalling Core Libraries & Graphics/Fonts ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y libpcre2-8-0 libgdk-pixbuf-2.0-0 libgtk-3-0 libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g libcairo2 libpango-1.0-0 libdrm2 shared-mime-info
                          read -p "Reinstall completed. Press Enter to continue..."
                          ;;
                      8)
                        clear
                        echo "=== Reinstalling ALL Base System & Game Packages (Safe Reinstall) ==="
                        export DEBIAN_FRONTEND=noninteractive
                        sudo apt-get update
                        sudo apt-get install --reinstall -y \
                            dialog git wget curl unzip xfce4-panel xfce4-terminal openbox xorg xserver-xorg \
                            console-setup pcmanfm chromium libpcre2-8-0 jstest-gtk joy2key xboxdrv \
                            bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant \
                            desktop-file-utils libgdk-pixbuf-2.0-0 libgtk-3-0 \
                            libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g \
                            libcairo2 libpango-1.0-0 libdrm2 shared-mime-info libfuse2 syslinux sudo
                        read -p "Reinstall completed. Press Enter to continue..."
                        ;;
                      9|*)
                          break
                          ;;
                  esac
              done
          }

          shutdown_restart_menu() {
              SHUT_CHOICE=$(dialog --clear --title "POWER OPTIONS" \
                  --menu "Select Power Action:" 12 50 3 \
                  "1" "🔄 Restart System" \
                  "2" "🛑 Shutdown System" \
                  "3" "🔙 Back to Control Center" 3>&1 1>&2 2>&3)
              
              if [ "$SHUT_CHOICE" = "1" ]; then
                  clear
                  sudo reboot
              elif [ "$SHUT_CHOICE" = "2" ]; then
                  clear
                  sudo poweroff
              fi
          }

          scan_and_manage_gamepads

          while true; do
              if [ ! -f "$APPS_DIR/terminal.desktop" ]; then
                  mkdir -p "$APPS_DIR"
                  cp -f "$BACKUP_APPS_DIR"/*.desktop "$APPS_DIR/" 2>/dev/null || true
              fi

              if [ -f /opt/kgamer/gamepad-helper.sh ]; then
                  /opt/kgamer/gamepad-helper.sh
              fi

              CHOICE=$(dialog --clear --title "RETROGAMER CONTROL CENTER" \
                  --menu "Select action (Use Arrows & Enter/ESC):" 22 65 14 \
                  "1" "RETURN TO EMULATION STATION" \
                  "2" "Open GUI Desktop (Openbox & XFCE Panel)" \
                  "3" "📊 System Monitor (CPU, GPU, RAM, Storage)" \
                  "4" "🌐 Change System Language (All Locales-All)" \
                  "5" "⌨️ Change Keyboard Layout (All Keyboards)" \
                  "6" "💻 Change Hostname (Makine Adı Yönetimi)" \
                  "7" "Gamepad Manager (Auto Scan & Disconnect)" \
                  "8" "Wi-Fi Manager (Scan, IP, Forget & Auto-Connect)" \
                  "9" "Create New User Account" \
                  "10" "Edit Existing User (Name/Password)" \
                  "11" "Change Root Password" \
                  "12" "Open RetroPie Setup Script" \
                  "13" "📦 Component Reinstaller (No Removal - Safe Refresh)" \
                  "14" "Exit / Restart / Shutdown" 3>&1 1>&2 2>&3)
              case $CHOICE in
                  1) clear; emulationstation ;;
                  2) start_desktop_environment ;;
                  3) /opt/kgamer/system-dashboard.sh ;;
                  4) configure_locale_and_language ;;
                  5) configure_keyboard_layout ;;
                  6) configure_hostname ;;
                  7) scan_and_manage_gamepads ;;
                  8) wifi_manager_menu ;;
                  9) create_new_user_account ;;
                  10) edit_existing_user ;;
                  11) change_root_password ;;
                  12) run_retropie_setup ;;
                  13) component_manager_menu ;;
                  14) shutdown_restart_menu ;;
              esac
          done
          EOF

          chmod +x mnt/opt/kgamer/kgamer-setup.sh

          # --- TÜM ROM KLASÖRLERİNE KONTROL MERKEZİ KISAYOLU EKLEME ---
          ROMS_DIR="mnt/home/kgamer/RetroPie/roms"
          if [ -d "$ROMS_DIR" ]; then
              for rom_dir in "$ROMS_DIR"/*/; do
                  if [ -d "$rom_dir" ]; then
                      bash -c "cat << 'SCRIPT_EOF' > '${rom_dir}RETROGAMER-CONTROL-CENTER.sh'
          #!/bin/bash
          /opt/kgamer/kgamer-setup.sh
          SCRIPT_EOF"
                      chmod +x "${rom_dir}RETROGAMER-CONTROL-CENTER.sh"

                      bash -c "cat << 'DESKTOP_EOF' > '${rom_dir}RETROGAMER.desktop'
          [Desktop Entry]
          Type=Application
          Name=RETROGAMER CONTROL CENTER
          Comment=RETROGAMER OS Launcher
          Exec=/opt/kgamer/kgamer-setup.sh
          Icon=gamepad
          Terminal=true
          Categories=Game;
          DESKTOP_EOF"
                      chmod +x "${rom_dir}RETROGAMER.desktop" 2>/dev/null || true
                  fi
              done
          fi

          # Systemd Servis Tanımlama
          tee mnt/etc/systemd/system/kgamer-setup.service << 'EOF' > /dev/null
          [Unit]
          Description=RETROGAMER First Boot Auto Setup
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/bin/bash /opt/kgamer/kgamer-setup.sh
          StandardInput=tty
          StandardOutput=tty
          TTYPath=/dev/tty1

          [Install]
          WantedBy=multi-user.target
          EOF

          chroot mnt systemctl enable kgamer-setup.service || true
          chroot mnt chown -R kgamer:kgamer /home/kgamer || true

          # Kernel vmlinuz ve initrd kopyalama
          cp -f mnt/boot/vmlinuz-* iso_root/live/vmlinuz 2>/dev/null || cp -f mnt/vmlinuz iso_root/live/vmlinuz 2>/dev/null || true
          cp -f mnt/boot/initrd.img-* iso_root/live/initrd.img 2>/dev/null || cp -f mnt/initrd.img iso_root/live/initrd.img 2>/dev/null || true

          # --- ISOLINUX DOSYALARINI DOĞRUDAN STANDARD KISMINA KURMA ---
          cp -f mnt/usr/lib/SYSLINUX/isolinux.bin iso_root/isolinux/ 2>/dev/null || \
          cp -f mnt/usr/share/syslinux/isolinux.bin iso_root/isolinux/ 2>/dev/null || \
          cp -f mnt/usr/lib/syslinux/modules/bios/isolinux.bin iso_root/isolinux/ 2>/dev/null || \
          cp -f /usr/lib/SYSLINUX/isolinux.bin iso_root/isolinux/ 2>/dev/null || \
          cp -f /usr/share/syslinux/isolinux.bin iso_root/isolinux/ 2>/dev/null || true

          cp -f mnt/usr/share/syslinux/* iso_root/isolinux/ 2>/dev/null || \
          cp -f mnt/usr/lib/syslinux/modules/bios/* iso_root/isolinux/ 2>/dev/null || \
          cp -f /usr/share/syslinux/* iso_root/isolinux/ 2>/dev/null || true

          # Unmount
          umount -lf mnt/dev/pts 2>/dev/null || true
          umount -lf mnt/dev 2>/dev/null || true
          umount -lf mnt/sys 2>/dev/null || true
          umount -lf mnt/proc 2>/dev/null || true
          umount -lf mnt 2>/dev/null || true

          # Squashfs Dosya Sistemini Oluşturma
          mksquashfs mnt iso_root/live/filesystem.squashfs -comp xz -b 1M -e proc sys dev run boot || true

          tee iso_root/isolinux/isolinux.cfg << 'EOF' > /dev/null
          DEFAULT retrogamer
          TIMEOUT 50
          PROMPT 1

          LABEL retrogamer
              KERNEL /live/vmlinuz
              APPEND initrd=/live/initrd.img boot=live components union=overlay quiet splash
          EOF

          # --- 4. GENISOIMAGE İLE DOĞRUDAN ISOLINUX/ISOLINUX.BIN YOLU İLE ISO OLUŞTURMA ---
          genisoimage -o RETROGAMER-AMD64-LIVE.iso \
              -b isolinux/isolinux.bin \
              -c isolinux/boot.cat \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -J -R -V "RETROGAMER_LIVE" iso_root/

          zip RETROGAMER-AMD64-LIVE.iso.zip RETROGAMER-AMD64-LIVE.iso

      - name: Upload Final Bootable ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RETROGAMER-AMD64-ISO
          path: RETROGAMER-AMD64-LIVE.iso.zip
