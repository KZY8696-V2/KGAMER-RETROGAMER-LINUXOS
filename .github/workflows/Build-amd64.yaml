name: Build RETROGAMER AMD64 Bootable ISO Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-amd64-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Up Last 10 Failed Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          echo "Checking and cleaning up to 10 oldest failed workflow runs..."
          REPO="${{ github.repository }}"
          
          for run_id in $(gh api repos/$REPO/actions/runs --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' | tail -n 10); do
              echo "Deleting failed run ID: $run_id"
              gh api --method DELETE repos/$REPO/actions/runs/$run_id || true
          done
          echo "Failed runs cleanup completed."

      - name: Install ISO Building Dependencies
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          rm -f /etc/apt/sources.list.d/microsoft*
          rm -f /etc/apt/trusted.gpg.d/microsoft*

          apt-get update
          apt-get install -y debootstrap squashfs-tools genisoimage xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools wget curl unzip zip e2fsprogs fdisk gdisk jstest-gtk joy2key xboxdrv git libfuse2 syslinux syslinux-common

      - name: Build AMD64 Debian Bookworm Live ISO System (Full Component Manager & Full Scripts)
        run: |
          [[ $EUID -ne 0 ]] && exec sudo /bin/bash "$0" "$@"
          DEBIAN_CODENAME="bookworm"
          echo "=== RETROGAMER AMD64 LIVE ISO BUILD STARTED (FULL COMPONENT MANAGER) ==="

          mkdir -p iso_root/live iso_root/boot/grub
          mkdir -p mnt

          # Debootstrap ile Debian Temel Sistemi Kurma
          echo "Bootstrapping Debian $DEBIAN_CODENAME AMD64 for ISO..."
          debootstrap --arch=amd64 "$DEBIAN_CODENAME" mnt http://deb.debian.org/debian/

          mount -t proc proc mnt/proc
          mount -t sysfs sysfs mnt/sys
          mount --bind /dev mnt/dev
          mount --bind /dev/pts mnt/dev/pts

          # --- CHROOT İÇİNDE KULLANICI VE TÜM PAKETLERİN KURULUMU ---
          chroot mnt bash -c "
          export DEBIAN_FRONTEND=noninteractive
          id -u kgamer &>/dev/null || useradd -m -s /bin/bash -G sudo,audio,video,input,games kgamer
          echo 'kgamer:kgamer' | chpasswd
          echo 'root:root' | chpasswd
          mkdir -p /home/kgamer
          chown -R kgamer:kgamer /home/kgamer

          apt-get update
          apt-get install -y --no-install-recommends \
              dialog git wget curl unzip xfce4-panel xfce4-terminal openbox xorg xserver-xorg \
              console-setup pcmanfm chromium libpcre2-8-0 jstest-gtk joy2key xboxdrv \
              bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant \
              desktop-file-utils plymouth plymouth-themes plymouth-label plymouth-x11 \
              libplymouth5 pix-plym-splash libgdk-pixbuf-2.0-0 libgtk-3-0 \
              libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g \
              libcairo2 libpango-1.0-0 libdrm2 shared-mime-info libfuse2 \
              grub-pc-bin grub-efi-amd64-bin linux-image-amd64 systemd-sysv sudo live-boot live-config
          "

          # --- PLYMOUTH TEMASI ---
          mkdir -p mnt/usr/share/plymouth/themes/retrogamer-boot || true

          if [ -d "frames" ]; then
              cp frames/frame_*.png mnt/usr/share/plymouth/themes/retrogamer-boot/ || true
          fi

          tee mnt/usr/share/plymouth/themes/retrogamer-boot/retrogamer-boot.plymouth << 'EOF' > /dev/null
          [Plymouth Theme]
          Name=Retrogamer Boot Animation
          Description=Fullscreen Non-Closable 30FPS Animation ending at frame 150
          ModuleName=script

          [script]
          ImageDir=/usr/share/plymouth/themes/retrogamer-boot
          ScriptFile=/usr/share/plymouth/themes/retrogamer-boot/retrogamer-boot.script
          EOF

          tee mnt/usr/share/plymouth/themes/retrogamer-boot/retrogamer-boot.script << 'EOF' > /dev/null
          anim_frames = 150;
          for (i = 1; i <= anim_frames; i++) {
              if (i < 10) {
                  img_name = "frame_000" + i;
              } else if (i < 100) {
                  img_name = "frame_00" + i;
              } else {
                  img_name = "frame_0" + i;
              }
              images[i] = Image(img_name + ".png");
          }

          framerate = 30;
          my_sprite = Sprite();
          screen_width = Window.GetWidth();
          screen_height = Window.GetHeight();

          fun refresh_callback () {
              local.time = Plymouth.GetAnimationTime();
              local.frame = Math.Int(local.time * framerate) + 1;
              
              if (local.frame >= anim_frames) {
                  local.frame = anim_frames;
                  my_sprite.SetImage(images[local.frame]);
                  Plymouth.Quit();
                  return;
              }
              my_sprite.SetImage(images[local.frame]);
          }

          Plymouth.SetRefreshFunction (refresh_callback);

          my_sprite.SetX(screen_width / 2 - images[1].GetWidth() / 2);
          my_sprite.SetY(screen_height / 2 - images[1].GetHeight() / 2);
          EOF

          chroot mnt plymouth-set-default-theme -R retrogamer-boot || true
          chroot mnt update-initramfs -u -k all || true

          # --- CHROOT İÇİNDE RETROPIE İLK KURULUMU (BUILD TIME) ---
          chroot mnt bash -c '
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /opt/kgamer
          cd /opt/kgamer
          if [ ! -d "RetroPie-Setup" ]; then
              git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup || true
          fi
          cd RetroPie-Setup
          export YES=1
          ./retropie_packages.sh core setup_packages < /dev/null || true
          ./retropie_packages.sh essentials < /dev/null || true
          ./retropie_packages.sh emulationstation install < /dev/null || true
          ./retropie_packages.sh retroarch install < /dev/null || true
          ' || true

          # --- GELİŞMİŞ GAMEPAD HELPER ---
          mkdir -p mnt/opt/kgamer
          tee mnt/opt/kgamer/gamepad-helper.sh << 'EOF' > /dev/null
          #!/bin/bash
          export TERM=linux
          if pgrep -x "joy2key" > /dev/null; then
              exit 0
          fi
          
          JS_DEV=""
          if [ -e /dev/input/js0 ]; then
              JS_DEV="/dev/input/js0"
          elif [ -e /dev/input/js1 ]; then
              JS_DEV="/dev/input/js1"
          fi

          if [ -n "$JS_DEV" ]; then
              joy2key -dev "$JS_DEV" -keys 0x1c 0x1c 0x01 0x01 &>/dev/null &
          fi
          EOF
          chmod +x mnt/opt/kgamer/gamepad-helper.sh

          chroot mnt bash -c '
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /opt/kgamer/apps
          mkdir -p /opt/kgamer/backup_apps
          mkdir -p /home/kgamer/RetroPie/roms/apps
          mkdir -p /home/kgamer/RetroPie/roms/games
          mkdir -p /home/kgamer/RetroPie/roms/ports

          cat << "EOF" > /opt/kgamer/apps/terminal.desktop
          [Desktop Entry]
          Name=XFCE Terminal
          Comment=Command Line Terminal
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Terminal=false
          Type=Application
          Categories=System;Application;
          EOF

          cat << "EOF" > /opt/kgamer/apps/chromium.desktop
          [Desktop Entry]
          Name=Chromium Browser
          Comment=Web Browser
          Exec=chromium --no-sandbox
          Icon=web-browser
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          cat << "EOF" > /opt/kgamer/apps/pcmanfm.desktop
          [Desktop Entry]
          Name=File Manager (PCManFM)
          Comment=Browse Files
          Exec=pcmanfm
          Icon=system-file-manager
          Terminal=false
          Type=Application
          Categories=System;
          EOF

          cp -f /opt/kgamer/apps/*.desktop /opt/kgamer/backup_apps/ 2>/dev/null || true
          chown -R kgamer:kgamer /home/kgamer/RetroPie 2>/dev/null || true
          '

          # --- SİSTEM DURUM MONİTÖRÜ ---
          tee mnt/opt/kgamer/system-dashboard.sh << 'EOF' > /dev/null
          #!/bin/bash
          export TERM=linux
          /opt/kgamer/gamepad-helper.sh

          while true; do
              if command -v vcgencmd &> /dev/null; then
                  cpu_temp=$(vcgencmd measure_temp | awk -F= '{print $2}')
              else
                  cpu_temp=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk '{printf "%.1f°C", $1/1000}')
                  [ -z "$cpu_temp" ] && cpu_temp="N/A"
              fi

              cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print 100 - $8"%"}')
              [ -z "$cpu_usage" ] && cpu_usage="N/A"

              if [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq ]; then
                  cpu_freq=$(awk '{printf "%.0f MHz", $1/1000}' /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq)
              else
                  cpu_freq="N/A"
              fi

              cpu_arch=$(uname -m)
              ram_info=$(free -h | grep Mem)
              ram_total=$(echo "$ram_info" | awk '{print $2}')
              ram_used=$(echo "$ram_info" | awk '{print $3}')
              ram_free=$(echo "$ram_info" | awk '{print $4}')

              disk_info=$(df -h / | tail -n 1)
              disk_total=$(echo "$disk_info" | awk '{print $2}')
              disk_used=$(echo "$disk_info" | awk '{print $3}')
              disk_avail=$(echo "$disk_info" | awk '{print $4}')
              disk_pct=$(echo "$disk_info" | awk '{print $5}')

              uptime_str=$(uptime -p)

              dialog --clear --title "RETROGAMER - SYSTEM STATUS DASHBOARD" \
                  --msgbox "CPU TEMPERATURE & HARDWARE INFO

          CPU Temperature : $cpu_temp
          CPU Usage       : $cpu_usage
          CPU Clock Speed : $cpu_freq
          CPU Architecture: $cpu_arch

          MEMORY (RAM) STATUS

          Total RAM       : $ram_total
          Used RAM        : $ram_used
          Free RAM        : $ram_free

          STORAGE STATUS

          Total Storage   : $disk_total
          Used Storage    : $disk_used ($disk_pct)
          Available Free  : $disk_avail

          SYSTEM RUNTIME

          Uptime          : $uptime_str" 22 65
              break
          done
          EOF
          chmod +x mnt/opt/kgamer/system-dashboard.sh

          tee mnt/home/kgamer/RetroPie/roms/ports/System-Dashboard.desktop << 'EOF' > /dev/null
          [Desktop Entry]
          Type=Application
          Name=📊 System Status Dashboard
          Comment=Check CPU temperature, RAM usage, and storage space
          Exec=/opt/kgamer/system-dashboard.sh
          Icon=utilities-system-monitor
          Terminal=true
          Categories=Settings;
          EOF
          chown kgamer:kgamer mnt/home/kgamer/RetroPie/roms/ports/System-Dashboard.desktop

          # --- UYGULAMA FİLTRELEME SCRIPTİ ---
          tee mnt/opt/kgamer/app-filter.sh << 'EOF' > /dev/null
          #!/bin/bash
          /opt/kgamer/gamepad-helper.sh
          APPS_SRC="/usr/share/applications"
          APPS_DEST="/home/kgamer/RetroPie/roms/apps"
          SPEC_FILE="/opt/kgamer/apps_filter.spec"

          mkdir -p "$APPS_DEST"

          desktop_files=()
          while IFS= read -r file; do
              if [ -f "$file" ]; then
                  if grep -q "NoDisplay=true" "$file"; then
                      continue
                  fi
                  desktop_files+=("$file")
              fi
          done < <(find "$APPS_SRC" -name "*.desktop")

          dialog_args=()
          for file in "${desktop_files[@]}"; do
              desktop_name=$(basename "$file")
              app_title=$(grep -m 1 "^Name=" "$file" | cut -d '=' -f2-)
              [ -z "$app_title" ] && app_title="$desktop_name"
              
              status="ON"
              if [ -f "$SPEC_FILE" ]; then
                  if grep -q "$desktop_name:OFF" "$SPEC_FILE"; then
                      status="OFF"
                  fi
              fi
              dialog_args+=("$desktop_name" "$app_title" "$status")
          done

          CHOICES=$(dialog --clear --title "RETROGAMER - APPS VISIBILITY FILTER" \
              --checklist "Select applications to show in EmulationStation APPS menu:" 22 70 12 \
              "${dialog_args[@]}" 3>&1 1>&2 2>&3)

          clear

          visible_apps=()
          for file in "${desktop_files[@]}"; do
              desktop_name=$(basename "$file")
              if echo "$CHOICES" | grep -q "\"$desktop_name\""; then
                  visible_apps+=("$desktop_name")
              fi
          done

          SORT_CHOICE=$(dialog --clear --title "RETROGAMER - APPS SORTING" \
              --menu "Select sorting method for apps:" 12 50 3 \
              "1" "Alphabetical Order (A-Z)" \
              "2" "Reverse Alphabetical Order (Z-A)" \
              "3" "Keep Default / Custom Spec Order" 3>&1 1>&2 2>&3)

          clear

          if [ "$SORT_CHOICE" = "1" ]; then
              IFS=$'\n' sorted_apps=($(sort <<< "${visible_apps[*]}"))
              unset IFS
          elif [ "$SORT_CHOICE" = "2" ]; then
              IFS=$'\n' sorted_apps=($(sort -r <<< "${visible_apps[*]}"))
              unset IFS
          else
              sorted_apps=("${visible_apps[@]}")
          fi

          find "$APPS_DEST" -name "*.desktop" ! -name "00-Filter-Apps.desktop" -delete
          > "$SPEC_FILE"

          for desktop_name in "${desktop_files[@]}"; do
              base_name=$(basename "$desktop_name")
              if echo "$CHOICES" | grep -q "\"$base_name\""; then
                  echo "$base_name:ON" >> "$SPEC_FILE"
              else
                  echo "$base_name:OFF" >> "$SPEC_FILE"
              fi
          done

          for app in "${sorted_apps[@]}"; do
              ln -sf "$APPS_SRC/$app" "$APPS_DEST/$app"
          done

          dialog --msgbox "Application filter and sorting updated successfully!" 6 50
          EOF
          chmod +x mnt/opt/kgamer/app-filter.sh

          tee mnt/home/kgamer/RetroPie/roms/apps/00-Filter-Apps.desktop << 'EOF' > /dev/null
          [Desktop Entry]
          Name=⚙️ Manage App Filters & Sorting
          Comment=Select and sort apps visible in EmulationStation
          Exec=/opt/kgamer/app-filter.sh
          Icon=preferences-system
          Terminal=true
          Type=Application
          Categories=System;
          EOF

          tee mnt/home/kgamer/RetroPie/roms/apps/RetroPie-Setup.desktop << 'EOF' > /dev/null
          [Desktop Entry]
          Type=Application
          Name=RetroPie Setup Script
          Comment=Configure RetroPie Core & Packages
          Exec=sudo /opt/kgamer/RetroPie-Setup/retropie_setup.sh
          Icon=system-run
          Terminal=true
          Categories=Settings;
          EOF

          # --- KONTROL MERKEZİ SCRIPTİ (`kgamer-setup.sh`) ---
          tee mnt/opt/kgamer/kgamer-setup.sh << 'EOF' > /dev/null
          #!/bin/bash
          if [ "$EUID" -ne 0 ]; then
              exit 1
          fi

          /opt/kgamer/gamepad-helper.sh

          APPS_DIR="/opt/kgamer/apps"
          BACKUP_APPS_DIR="/opt/kgamer/backup_apps"

          configure_keyboard_layout() {
              /opt/kgamer/gamepad-helper.sh
              KB_CHOICE=$(dialog --clear --title "RETROGAMER - KEYBOARD & LANGUAGE SELECTOR" \
                  --menu "Select your keyboard layout / country:" 20 65 11 \
                  "us" "English (US) - Standard QWERTY" \
                  "uk" "English (UK)" \
                  "tr" "Turkish (Q / F Choice)" \
                  "de" "German (DE - QWERTZ)" \
                  "fr" "French (FR - AZERTY)" \
                  "es" "Spanish (ES)" \
                  "it" "Italian (IT)" \
                  "br" "Portuguese (Brazil)" \
                  "jp" "Japanese (JP)" \
                  "other" "Other Layout (Manual Code)" 3>&1 1>&2 2>&3)

              if [ "$KB_CHOICE" = "tr" ]; then
                  TR_VARIANT=$(dialog --clear --title "TURKISH KEYBOARD VARIANT" \
                      --menu "Select Turkish keyboard type:" 10 50 2 \
                      "q" "Turkish Q Klavye" \
                      "f" "Turkish F Klavye" 3>&1 1>&2 2>&3)
                  if [ "$TR_VARIANT" = "f" ]; then
                      KB_CHOICE="tr"
                      VARIANT_ARG="f"
                  else
                      KB_CHOICE="tr"
                      VARIANT_ARG="q"
                  fi
              elif [ "$KB_CHOICE" = "other" ]; then
                  CUSTOM_KB=$(dialog --inputbox "Enter keyboard layout code (e.g., us, tr, dk, fi):" 8 50 "us" 3>&1 1>&2 2>&3)
                  [ -n "$CUSTOM_KB" ] && KB_CHOICE="$CUSTOM_KB"
              fi

              if [ -n "$KB_CHOICE" ]; then
                  if [ "$KB_CHOICE" = "tr" ] && [ "$VARIANT_ARG" = "f" ]; then
                      localectl set-x11-keymap tr pc105 f 2>/dev/null || true
                      loadkeys trf 2>/dev/null || true
                      dialog --msgbox "Keyboard layout successfully updated to Turkish F!" 5 50
                  else
                      localectl set-x11-keymap "$KB_CHOICE" 2>/dev/null || true
                      loadkeys "$KB_CHOICE" 2>/dev/null || true
                      dialog --msgbox "Keyboard layout successfully updated to '$KB_CHOICE'!" 5 50
                  fi
              fi
          }

          scan_and_manage_gamepads() {
              /opt/kgamer/gamepad-helper.sh
              start_time=$(date +%s)
              
              while true; do
                  current_time=$(date +%s)
                  elapsed=$((current_time - start_time))
                  mins=$((elapsed / 60))
                  secs=$((elapsed % 60))
                  time_str=$(printf "%02d:%02d" $mins $secs)

                  found_pads=""
                  index=1
                  declare -A pad_paths
                  for js in /dev/input/js*; do
                      if [ -e "$js" ]; then
                          pad_name=$(cat /sys/class/input/$(basename $js)/device/name 2>/dev/null || echo "Gamepad $index")
                          found_pads="$found_pads $index \"$pad_name ($js)\" ON"
                          pad_paths[$index]="$js"
                          index=$((index + 1))
                      fi
                  done

                  if [ -z "$found_pads" ]; then
                      timeout 5 dialog --clear --title "RETROGAMER - GAMEPAD MANAGER (Süre: $time_str)" \
                          --msgbox "No gamepads connected. Searching continuously...\n(Press ESC or Enter to access menu / Stop)" 8 55
                      ret_val=$?
                      if [ $ret_val -ne 0 ]; then
                          break
                      fi
                  else
                      exec 3>&1
                      SUB_CHOICE=$(eval dialog --clear --title "RETROGAMER - GAMEPAD MANAGER (Süre: $time_str)" \
                          --menu "Connected gamepads found. Select to Disconnect/Unpair or Rescan:" 16 70 7 \
                          "REFRESH" "🔄 Rescan / Refresh List" \
                          "DISCONNECT" "🔌 Disconnect / Kill Gamepad Connection" \
                          "BACK" "🔙 Return to Main Menu" \
                          $found_pads 2>&1 3>&-);
                      ret_val=$?
                      exec 3>&-

                      if [ $ret_val -ne 0 ] || [ "$SUB_CHOICE" = "BACK" ]; then
                          break
                      elif [ "$SUB_CHOICE" = "REFRESH" ]; then
                          continue
                      elif [ "$SUB_CHOICE" = "DISCONNECT" ]; then
                          exec 3>&1
                          TARGET_PAD=$(eval dialog --clear --title "DISCONNECT GAMEPAD" \
                              --menu "Select gamepad to disconnect:" 12 60 4 $found_pads 2>&1 3>&-);
                          exec 3>&-
                          
                          if [ -n "$TARGET_PAD" ] && [ -n "${pad_paths[$TARGET_PAD]}" ]; then
                              target_js="${pad_paths[$TARGET_PAD]}"
                              pkill -f "joy2key.*$target_js" || true
                              mac_addr=$(cat /sys/class/input/$(basename $target_js)/device/address 2>/dev/null || true)
                              if [ -n "$mac_addr" ]; then
                                  bluetoothctl disconnect "$mac_addr" &>/dev/null || true
                              else
                                  bluetoothctl disconnect &>/dev/null || true
                              fi
                              dialog --msgbox "Gamepad disconnected successfully!" 5 45
                          fi
                      fi
                  fi
              done
          }

          wifi_manager_menu() {
              /opt/kgamer/gamepad-helper.sh
              start_time=$(date +%s)

              while true; do
                  current_time=$(date +%s)
                  elapsed=$((current_time - start_time))
                  mins=$((elapsed / 60))
                  secs=$((elapsed % 60))
                  time_str=$(printf "%02d:%02d" $mins $secs)

                  current_ip=$(hostname -I 2>/dev/null | awk '{print $1}')
                  [ -z "$current_ip" ] && current_ip="Not Connected (No IP)"

                  WIFI_ACTION=$(dialog --clear --title "RETROGAMER - WIFI MANAGER (Süre: $time_str)" \
                      --menu "Current IP: $current_ip\nSelect Wi-Fi Action:" 18 65 7 \
                      "1" "📡 Scan & Connect Wi-Fi (Continuous Auto-Scan)" \
                      "2" "🔍 View Current IP Address" \
                      "3" "❌ Disconnect / Forget Wi-Fi Connection" \
                      "4" "🔙 Return to Main Menu" 3>&1 1>&2 2>&3)

                  case $WIFI_ACTION in
                      1)
                          wifi_list=""
                          if command -v nmcli &> /dev/null; then
                              nmcli dev wifi rescan &>/dev/null || true
                              while IFS= read -r line; do
                                  ssid=$(echo "$line" | awk -F: '{print $2}' | xargs)
                                  [ -n "$ssid" ] && wifi_list="$wifi_list \"$ssid\" \"Signal: $(echo $line | awk -F: '{print $6}')%\""
                              done < <(nmcli -t -f SSID,SIGNAL,SECURITY dev wifi list | grep -v '^--')
                          fi

                          if [ -z "$wifi_list" ]; then
                              timeout 5 dialog --clear --title "WIFI SCAN (Süre: $time_str)" \
                                  --msgbox "No Wi-Fi networks found or scanning...\n(Timeout active, will retry continuously)" 7 50
                          else
                              exec 3>&1
                              CHOSEN_SSID=$(eval dialog --clear --title "AVAILABLE WIFI NETWORKS" \
                                  --menu "Select network to connect automatically:" 15 60 6 $wifi_list 2>&1 3>&-);
                              ret_val=$?
                              exec 3>&-

                              if [ $ret_val -eq 0 ] && [ -n "$CHOSEN_SSID" ]; then
                                  WIFI_PASS=$(dialog --clear --title "WIFI PASSWORD" \
                                      --passwordbox "Enter password for '$CHOSEN_SSID':" 8 50 3>&1 1>&2 2>&3)
                                  if [ -n "$WIFI_PASS" ]; then
                                      nmcli dev wifi connect "$CHOSEN_SSID" password "$WIFI_PASS" &>/dev/null || \
                                      sudo nmcli dev wifi connect "$CHOSEN_SSID" password "$WIFI_PASS" &>/dev/null || true
                                      dialog --msgbox "Attempted connection to '$CHOSEN_SSID'!" 5 50
                                  fi
                              fi
                          fi
                          ;;
                      2)
                          dialog --msgbox "Current Device IP Address:\n$current_ip" 6 40
                          ;;
                      3)
                          if command -v nmcli &> /dev/null; then
                              active_conn=$(nmcli -t -f NAME,TYPE connection show --active | grep wireless | cut -d: -f1)
                              if [ -n "$active_conn" ]; then
                                  nmcli connection down "$active_conn" &>/dev/null || true
                                  nmcli connection delete "$active_conn" &>/dev/null || true
                              else
                                  nmcli dev disconnect wlan0 &>/dev/null || true
                              fi
                          fi
                          dialog --msgbox "Wi-Fi connection disconnected and forgotten successfully!" 6 50
                          ;;
                      4|*)
                          break
                          ;;
                  esac
              done
          }

          create_new_user_account() {
              /opt/kgamer/gamepad-helper.sh
              while true; do
                  NEW_USER=$(dialog --clear --title "NEW USER SETUP (MANDATORY)" \
                      --inputbox "Enter new username (Cannot be empty):" 8 50 3>&1 1>&2 2>&3)
                  [ -z "$NEW_USER" ] && continue
                  
                  if id "$NEW_USER" &>/dev/null; then
                      dialog --msgbox "User '$NEW_USER' already exists! Choose another name." 6 50
                      continue
                  fi
                  break
              done

              while true; do
                  NEW_PASS=$(dialog --clear --title "NEW USER PASSWORD (MANDATORY)" \
                      --passwordbox "Enter password for $NEW_USER (Cannot be empty):" 8 50 3>&1 1>&2 2>&3)
                  [ -z "$NEW_PASS" ] && continue
                  break
              done

              useradd -m -s /bin/bash -G sudo,audio,video,input,games "$NEW_USER" 2>/dev/null
              echo "$NEW_USER:$NEW_PASS" | chpasswd
              dialog --msgbox "User '$NEW_USER' created successfully!" 5 45
          }

          edit_existing_user() {
              /opt/kgamer/gamepad-helper.sh
              while true; do
                  TARGET_USER=$(dialog --clear --title "EDIT USER (MANDATORY)" \
                      --inputbox "Enter existing username to edit (e.g., kgamer):" 8 50 "kgamer" 3>&1 1>&2 2>&3)
                  [ -z "$TARGET_USER" ] && continue
                  
                  if id "$TARGET_USER" &>/dev/null; then
                      break
                  else
                      dialog --msgbox "User '$TARGET_USER' not found! Try again." 5 45
                  fi
              done

              ACTION=$(dialog --clear --title "Edit User: $TARGET_USER" \
                  --menu "Select option:" 12 50 2 \
                  "1" "Change Username" \
                  "2" "Change Password" 3>&1 1>&2 2>&3)
              
              if [ "$ACTION" = "1" ]; then
                  while true; do
                      NEW_NAME=$(dialog --clear --title "CHANGE USERNAME" \
                          --inputbox "Enter new username for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
                      [ -z "$NEW_NAME" ] && continue
                      usermod -l "$NEW_NAME" "$TARGET_USER" 2>/dev/null
                      dialog --msgbox "Username changed to '$NEW_NAME' successfully!" 5 50
                      break
                  done
              elif [ "$ACTION" = "2" ]; then
                  while true; do
                      NEW_P=$(dialog --clear --title "CHANGE PASSWORD" \
                          --passwordbox "Enter new password for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
                      [ -z "$NEW_P" ] && continue
                      echo "$TARGET_USER:$NEW_P" | chpasswd
                      dialog --msgbox "Password updated successfully!" 5 40
                      break
                  done
              fi
          }

          change_root_password() {
              /opt/kgamer/gamepad-helper.sh
              ROOT_P=$(dialog --passwordbox "Enter new ROOT password:" 8 50 3>&1 1>&2 2>&3)
              if [ -n "$ROOT_P" ]; then
                  echo "root:$ROOT_P" | chpasswd
                  dialog --msgbox "Root password updated successfully!" 5 45
              fi
          }

          start_desktop_environment() {
              clear
              echo "[+] Openbox ve Alttaki XFCE Paneli başlatılıyor..."
              export DISPLAY=:0
              xfconf-query -c xfce4-panel -p /panels/panel-1/position -s "p=8;x=0;y=0" --create -t string 2>/dev/null || true
              xfce4-panel --display=:0 &
              exec openbox-session
          }

          run_retropie_setup() {
              clear
              echo "[+] RetroPie Setup Script açılıyor..."
              cd /opt/kgamer/RetroPie-Setup
              sudo ./retropie_packages.sh
              echo ""
              read -p "Press Enter to return to RETROGAMER Control Center..."
          }

          component_manager_menu() {
              while true; do
                  COMP_CHOICE=$(dialog --clear --title "COMPONENT INSTALLER & REINSTALLER" \
                      --menu "Select a component to install or reinstall via APT / GitHub:" 20 65 10 \
                      "1" "🔄 Reinstall RetroPie & Setup Script (GitHub)" \
                      "2" "📦 Reinstall Desktop Environment (XFCE Panel, Openbox, Xorg)" \
                      "3" "🌐 Reinstall Web & File Tools (Chromium, PCManFM)" \
                      "4" "🎮 Reinstall Gamepad & Input Helpers (joy2key, xboxdrv, jstest-gtk)" \
                      "5" "📶 Reinstall Connectivity Tools (Bluez, Network-Manager, Wpasupplicant)" \
                      "6" "🎨 Reinstall Plymouth Boot Animation Theme" \
                      "7" "🛠️ Reinstall System Utilities & CLI Tools (dialog, git, wget, curl, unzip, FUSE)" \
                      "8" "⚙️ Reinstall Core Libraries & Fonts (libpng, freetype, zlib, cairo, pango)" \
                      "9" "📦 Reinstall ALL Base Packages (Full APT Reinstall)" \
                      "10" "🔙 Return to Main Control Center" 3>&1 1>&2 2>&3)
                  
                  case $COMP_CHOICE in
                      1)
                          clear
                          echo "=== Reinstalling RetroPie Setup & Core Packages ==="
                          cd /opt/kgamer
                          rm -rf RetroPie-Setup
                          git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup
                          cd RetroPie-Setup
                          export YES=1
                          export DEBIAN_FRONTEND=noninteractive
                          sudo ./retropie_packages.sh core setup_packages < /dev/null || true
                          sudo ./retropie_packages.sh essentials < /dev/null || true
                          sudo ./retropie_packages.sh emulationstation install < /dev/null || true
                          sudo ./retropie_packages.sh retroarch install < /dev/null || true
                          read -p "Press Enter to continue..."
                          ;;
                      2)
                          clear
                          echo "=== Reinstalling Desktop Environments (XFCE & Openbox) ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y xfce4-panel xfce4-terminal openbox xorg xserver-xorg desktop-file-utils
                          read -p "Press Enter to continue..."
                          ;;
                      3)
                          clear
                          echo "=== Reinstalling Chromium & PCManFM ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y chromium pcmanfm
                          read -p "Press Enter to continue..."
                          ;;
                      4)
                          clear
                          echo "=== Reinstalling Gamepad & Input Helpers ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y joy2key xboxdrv jstest-gtk
                          read -p "Press Enter to continue..."
                          ;;
                      5)
                          clear
                          echo "=== Reinstalling Network & Bluetooth Tools ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant
                          read -p "Press Enter to continue..."
                          ;;
                      6)
                          clear
                          echo "=== Reinstalling Plymouth Boot Animation ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y plymouth plymouth-themes plymouth-label plymouth-x11 libplymouth5 pix-plym-splash
                          sudo plymouth-set-default-theme -R retrogamer-boot || true
                          sudo update-initramfs -u -k all || true
                          read -p "Press Enter to continue..."
                          ;;
                      7)
                          clear
                          echo "=== Reinstalling System Utilities & CLI Tools ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y dialog git wget curl unzip console-setup libfuse2 sudo
                          read -p "Press Enter to continue..."
                          ;;
                      8)
                          clear
                          echo "=== Reinstalling Core Libraries & Graphics/Fonts ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y libpcre2-8-0 libgdk-pixbuf-2.0-0 libgtk-3-0 libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g libcairo2 libpango-1.0-0 libdrm2 shared-mime-info
                          read -p "Press Enter to continue..."
                          ;;
                      9)
                          clear
                          echo "=== Reinstalling ALL Base System & Game Packages ==="
                          export DEBIAN_FRONTEND=noninteractive
                          sudo apt-get update
                          sudo apt-get install --reinstall -y \
                              dialog git wget curl unzip xfce4-panel xfce4-terminal openbox xorg xserver-xorg \
                              console-setup pcmanfm chromium libpcre2-8-0 jstest-gtk joy2key xboxdrv \
                              bluetooth bluez bluez-tools network-manager wireless-tools wpasupplicant \
                              desktop-file-utils plymouth plymouth-themes plymouth-label plymouth-x11 \
                              libplymouth5 pix-plym-splash libgdk-pixbuf-2.0-0 libgtk-3-0 \
                              libpng16-16 libpng-tools libjpeg62-turbo libfreetype6 zlib1g \
                              libcairo2 libpango-1.0-0 libdrm2 shared-mime-info libfuse2 grub-pc grub-efi-amd64 sudo
                          read -p "Press Enter to continue..."
                          ;;
                      10|*)
                          break
                          ;;
                  esac
              done
          }

          shutdown_restart_menu() {
              SHUT_CHOICE=$(dialog --clear --title "POWER OPTIONS" \
                  --menu "Select Power Action:" 12 50 3 \
                  "1" "🔄 Restart System" \
                  "2" "🛑 Shutdown System" \
                  "3" "🔙 Back to Control Center" 3>&1 1>&2 2>&3)
              
              if [ "$SHUT_CHOICE" = "1" ]; then
                  clear
                  sudo reboot
              elif [ "$SHUT_CHOICE" = "2" ]; then
                  clear
                  sudo poweroff
              fi
          }

          if [ ! -f "/opt/kgamer/.keyboard_configured" ]; then
              configure_keyboard_layout
              touch "/opt/kgamer/.keyboard_configured"
          fi

          scan_and_manage_gamepads

          while true; do
              if [ ! -f "$APPS_DIR/terminal.desktop" ]; then
                  mkdir -p "$APPS_DIR"
                  cp -f "$BACKUP_APPS_DIR"/*.desktop "$APPS_DIR/" 2>/dev/null || true
              fi

              /opt/kgamer/gamepad-helper.sh
              CHOICE=$(dialog --clear --title "RETROGAMER CONTROL CENTER" \
                  --menu "Select action (Use Arrows & Enter/ESC):" 22 65 10 \
                  "1" "RETURN TO EMULATION STATION" \
                  "2" "Open GUI Desktop (Openbox & XFCE Panel)" \
                  "3" "Change Keyboard Layout & Language" \
                  "4" "Gamepad Manager (Auto Scan & Disconnect)" \
                  "5" "Wi-Fi Manager (Scan, IP, Forget & Auto-Connect)" \
                  "6" "Create New User Account" \
                  "7" "Edit Existing User (Name/Password)" \
                  "8" "Change Root Password" \
                  "9" "Open RetroPie Setup Script" \
                  "10" "📦 Component Installer & Reinstaller (APT & GitHub)" \
                  "11" "Exit / Restart / Shutdown" 3>&1 1>&2 2>&3)
              case $CHOICE in
                  1) clear; emulationstation ;;
                  2) start_desktop_environment ;;
                  3) configure_keyboard_layout ;;
                  4) scan_and_manage_gamepads ;;
                  5) wifi_manager_menu ;;
                  6) create_new_user_account ;;
                  7) edit_existing_user ;;
                  8) change_root_password ;;
                  9) run_retropie_setup ;;
                  10) component_manager_menu ;;
                  11) shutdown_restart_menu ;;
              esac
          done
          EOF

          chmod +x mnt/opt/kgamer/kgamer-setup.sh

          # --- TÜM ROM KLASÖRLERİNE KONTROL MERKEZİ KISAYOLU EKLEME ---
          ROMS_DIR="mnt/home/kgamer/RetroPie/roms"
          if [ -d "$ROMS_DIR" ]; then
              for rom_dir in "$ROMS_DIR"/*/; do
                  if [ -d "$rom_dir" ]; then
                      bash -c "cat << 'SCRIPT_EOF' > '${rom_dir}RETROGAMER-CONTROL-CENTER.sh'
          #!/bin/bash
          /opt/kgamer/kgamer-setup.sh
          SCRIPT_EOF"
                      chmod +x "${rom_dir}RETROGAMER-CONTROL-CENTER.sh"

                      bash -c "cat << 'DESKTOP_EOF' > '${rom_dir}RETROGAMER.desktop'
          [Desktop Entry]
          Type=Application
          Name=RETROGAMER CONTROL CENTER
          Comment=RETROGAMER OS Launcher
          Exec=/opt/kgamer/kgamer-setup.sh
          Icon=gamepad
          Terminal=true
          Categories=Game;
          DESKTOP_EOF"
                      chmod +x "${rom_dir}RETROGAMER.desktop"
                  fi
              done
          fi

          # Systemd Servis Tanımlama
          tee mnt/etc/systemd/system/kgamer-setup.service << 'EOF' > /dev/null
          [Unit]
          Description=RETROGAMER First Boot Auto Setup
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/bin/bash /opt/kgamer/kgamer-setup.sh
          StandardInput=tty
          StandardOutput=tty
          TTYPath=/dev/tty1

          [Install]
          WantedBy=multi-user.target
          EOF

          chroot mnt systemctl enable kgamer-setup.service
          chown -R kgamer:kgamer mnt/home/kgamer 2>/dev/null || true

          # Kernel vmlinuz ve initrd kopyalama (ISO boot için)
          cp mnt/boot/vmlinuz-* iso_root/live/vmlinuz || cp mnt/vmlinuz iso_root/live/vmlinuz || true
          cp mnt/boot/initrd.img-* iso_root/live/initrd.img || cp mnt/initrd.img iso_root/live/initrd.img || true

          # Sanal ve bağlanan dosya sistemlerini güvenli bir şekilde unmount etme
          umount mnt/dev/pts || true
          umount mnt/dev || true
          umount mnt/sys || true
          umount mnt/proc || true
          umount mnt || true

          # Squashfs Dosya Sistemini Oluşturma (Sanal proc, sys, dev dizinlerini hariç tutarak)
          mksquashfs mnt iso_root/live/filesystem.squashfs -comp xz -b 1M -e proc sys dev run boot

          # GRUB ve ISO Yapılandırması
          tee iso_root/boot/grub/grub.cfg << 'EOF' > /dev/null
          set timeout=5
          set default=0
          menuentry "RETROGAMER Live AMD64" {
              linux /live/vmlinuz boot=live quiet
              initrd /live/initrd.img
          }
          EOF

          # Genisoimage ile Boot Edilebilir ISO Oluşturma
          genisoimage -o RETROGAMER-AMD64-LIVE.iso \
              -b boot/grub/i386-pc/eltorito.img \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -eltorito-alt-boot \
              -e boot/grub/efi.img -no-emul-boot \
              iso_root/ || genisoimage -o RETROGAMER-AMD64-LIVE.iso -R -J iso_root/

          zip RETROGAMER-AMD64-LIVE.iso.zip RETROGAMER-AMD64-LIVE.iso

      - name: Upload Final Bootable ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RETROGAMER-AMD64-ISO
          path: RETROGAMER-AMD64-LIVE.iso.zip
