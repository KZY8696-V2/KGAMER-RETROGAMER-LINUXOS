name: Build KGAMER-RETROGAMER IMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-img:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support parted dosfstools e2fsprogs squashfs-tools xorriso curl wget git

      - name: Download Base Debian Arm64 Rootfs & Create Image
        run: |
          # 1. 3GB'lık boş imaj dosyası oluştur
          dd if=/dev/zero of=KGAMER-RETROGAMER.img bs=1M count=3072
          
          # 2. Disk bölümlemesi (MBR / DOS tablosu ve tek partition)
          parted --script KGAMER-RETROGAMER.img mklabel msdos
          parted --script KGAMER-RETROGAMER.img mkpart primary ext4 4MiB 100%
          
          # 3. --partscan ile loop cihazına bağla
          LOOP_DEV=$(sudo losetup --find --show --partscan KGAMER-RETROGAMER.img)
          
          if [ -b "${LOOP_DEV}p1" ]; then
              LOOP_PART="${LOOP_DEV}p1"
          elif [ -b "${LOOP_DEV}1" ]; then
              LOOP_PART="${LOOP_DEV}1"
          else
              LOOP_PART=$(ls ${LOOP_DEV}* | grep -E '[0-9]+$' | head -n 1)
          fi
          
          echo "Using partition: $LOOP_PART"
          
          # 4. Dosya sistemini biçimlendir ve bağla
          sudo mkfs.ext4 -F "$LOOP_PART"
          mkdir -p mnt
          sudo mount "$LOOP_PART" mnt
          
          # 5. Debootstrap çalıştır
          sudo debootstrap --arch=arm64 --no-check-gpg --include=qemu-user-static,sudo,systemd,systemd-sysv,udev,kmod,netbase bookworm mnt http://deb.debian.org/debian/
          sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/

      - name: Inject KGAMER-RETROGAMER Features, RetroPie, GUI & Protections into IMG
        run: |
          LOOP_DEV=$(sudo losetup -j KGAMER-RETROGAMER.img | cut -d ':' -f1 | head -n 1)
          
          if [ -b "${LOOP_DEV}p1" ]; then
              LOOP_PART="${LOOP_DEV}p1"
          elif [ -b "${LOOP_DEV}1" ]; then
              LOOP_PART="${LOOP_DEV}1"
          else
              LOOP_PART=$(ls ${LOOP_DEV}* | grep -E '[0-9]+$' | head -n 1)
          fi
          
          echo "Mounting partition: $LOOP_PART"
          
          if ! mountpoint -q mnt; then
              sudo mount "$LOOP_PART" mnt
          else
              echo "Partition is already mounted."
          fi

          # Chroot ortamı için gerekli mount'lar
          mountpoint -q mnt/proc || sudo mount -t proc proc mnt/proc
          mountpoint -q mnt/dev || sudo mount --bind /dev mnt/dev
          mountpoint -q mnt/dev/pts || sudo mount --bind /dev/pts mnt/dev/pts
          mountpoint -q mnt/sys || sudo mount --bind /sys mnt/sys

          # Sistem içi kurulacak script ve konfigürasyonları chroot içine aktar
          sudo mkdir -p mnt/opt/kgamer
          
          # Chroot içinde çalışacak kurulum betiği
          sudo tee mnt/opt/kgamer/setup.sh << 'EOF' > /dev/null
          export DEBIAN_FRONTEND=noninteractive

          # apt hızlandırma ve önbellek ayarları
          echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
          echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/80-recommends

          # 1. Erken paket kurulumu
          apt-get update
          apt-get install -y git e2fsprogs whiptail dialog sudo systemd systemd-sysv

          # 2. Kullanıcıyı erken oluştur
          REAL_USER="pi"
          id -u "$REAL_USER" &>/dev/null || useradd -m -s /bin/bash "$REAL_USER"
          USER_HOME=$(eval echo "~$REAL_USER")
          usermod -aG sudo,audio,video,input "$REAL_USER" 2>/dev/null || true
          echo "$REAL_USER ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # 3. Kalan paketlerin ve çekirdeğin kurulumu
          apt-get install -y linux-image-arm64 u-boot-menu xserver-xorg-core xinit openbox xfce4-panel pcmanfm gvfs gvfs-backends zenity lxterminal picom parted chromium keyboard-configuration build-essential cmake curl wget unzip

          # Extlinux Konfigürasyonunu Oluştur
          mkdir -p /boot/extlinux
          cat << 'EOT' > /boot/extlinux/extlinux.conf
          DEFAULT kgamer
          LABEL kgamer
            KERNEL /boot/vmlinuz
            INITRD /boot/initrd.img
            APPEND root=/dev/vda2 rw console=ttyAMA0 rootwait
          EOT

          # A. EmulationStation Uygulama Otomatik Köprüsü (Anti-Deletion Koruma Entegre)
          cat << 'EOT' > /usr/local/bin/update_es_apps.sh
          #!/bin/bash
          TARGET_HOME=\$(eval echo "~${REAL_USER}")
          APPS_DIR="\$TARGET_HOME/RetroPie/roms/apps"
          
          chattr -i "\$APPS_DIR" 2>/dev/null || true
          mkdir -p "\$APPS_DIR"
          rm -f "\$APPS_DIR"/*.sh 2>/dev/null || true

          cat << 'EEE' > "\$APPS_DIR/Terminal.sh"
          #!/bin/bash
          lxterminal
          EEE
          chmod +x "\$APPS_DIR/Terminal.sh"
          chattr +i "\$APPS_DIR/Terminal.sh" 2>/dev/null || true

          cat << 'EEE' > "\$APPS_DIR/Chromium.sh"
          #!/bin/bash
          chromium --no-sandbox --disable-gpu
          EEE
          chmod +x "\$APPS_DIR/Chromium.sh"
          chattr +i "\$APPS_DIR/Chromium.sh" 2>/dev/null || true

          cat << 'EEE' > "\$APPS_DIR/PCManFM_Filemanager.sh"
          #!/bin/bash
          pcmanfm
          EEE
          chmod +x "\$APPS_DIR/PCManFM_Filemanager.sh"
          chattr +i "\$APPS_DIR/PCManFM_Filemanager.sh" 2>/dev/null || true

          for desktop_file in /usr/share/applications/*.desktop; do
              if [ -f "\$desktop_file" ]; then
                  name=\$(grep -m 1 "^Name=" "\$desktop_file" | cut -d'=' -f2-)
                  exec_cmd=\$(grep -m 1 "^Exec=" "\$desktop_file" | cut -d'=' -f2- | awk '{print \$1}')
                  if [ ! -z "\$name" ] && [ ! -z "\$exec_cmd" ]; then
                      safe_name=\$(echo "\$name" | tr '/' '_' | tr ' ' '_')
                      cat << EEE > "\$APPS_DIR/\$safe_name.sh"
          #!/bin/bash
          \$exec_cmd
          EEE
                      chmod +x "\$APPS_DIR/\$safe_name.sh"
                      chattr +i "\$APPS_DIR/\$safe_name.sh" 2>/dev/null || true
                  fi
              fi
          done
          chattr +i "\$APPS_DIR" 2>/dev/null || true
          EOT
          chmod +x /usr/local/bin/update_es_apps.sh
          chattr +i /usr/local/bin/update_es_apps.sh

          # B. Modüler Reinstall & Onarım Menüsü (Korumalı)
          cat << 'EOT' > /usr/local/bin/kgamer_retropie_reinstall.sh
          #!/bin/bash
          TARGET_HOME=\$(eval echo "~${REAL_USER}")
          while true; do
              CHOICES=\$(whiptail --title "KGAMER-RETROGAMER ORANGE PI REPAIR & SETUP (LOCKED & PROTECTED)" --checklist \
                  "Select components to reinstall/repair (System files are anti-deletion protected):" 22 75 6 \
                  "RETROPIE" "Reinstall RetroPie Core & EmulationStation" OFF \
                  "SETUP_SCRIPT" "Redownload & Setup RetroPie-Setup Script" OFF \
                  "X11_SYSTEM" "Reinstall X11, Openbox & Bottom XFCE Panel" OFF \
                  "APPS_LINKS" "Regenerate Locked Terminal, Chromium & Apps" ON 3>&1 1>&2 2>&3)

              exitstatus=\$?
              if [ \$exitstatus -ne 0 ]; then
                  exit 0
              fi

              if [ -z "\$CHOICES" ]; then
                  whiptail --title "Warning" --msgbox "No option selected!" 8 40
                  continue
              fi

              (
                if [[ "\$CHOICES" =~ "SETUP_SCRIPT" ]] || [ ! -d "\$TARGET_HOME/RetroPie-Setup" ]; then
                    echo 10; rm -rf "\$TARGET_HOME/RetroPie-Setup"
                    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git "\$TARGET_HOME/RetroPie-Setup"
                    chown -R ${REAL_USER}:${REAL_USER} "\$TARGET_HOME/RetroPie-Setup"
                fi

                cd "\$TARGET_HOME/RetroPie-Setup" || exit 1

                if [[ "\$CHOICES" =~ "RETROPIE" ]]; then
                    echo 40; DEBIAN_FRONTEND=noninteractive ./retropie_packages.sh setup basic_install
                    ./retropie_packages.sh emulationstation
                    ./retropie_packages.sh retropiemenu
                fi

                if [[ "\$CHOICES" =~ "X11_SYSTEM" ]]; then
                    echo 80; apt-get install --reinstall -y xserver-xorg-core xinit openbox xfce4-panel pcmanfm gvfs gvfs-backends zenity lxterminal picom chromium
                fi

                if [[ "\$CHOICES" =~ "APPS_LINKS" ]]; then
                    echo 95; /usr/local/bin/update_es_apps.sh
                fi

                echo 100;
              ) | whiptail --gauge "Restoring protected components safely..." 6 60 0

              whiptail --title "Success" --msgbox "Restoration completed safely! All protections remain active." 8 50
              break
          done
          EOT
          chmod +x /usr/local/bin/kgamer_retropie_reinstall.sh
          chattr +i /usr/local/bin/kgamer_retropie_reinstall.sh

          # İlk Kurulum ve Kilitleme
          mkdir -p "$USER_HOME/RetroPie/roms/apps" "$USER_HOME/.config/openbox" "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml"
          git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git "$USER_HOME/RetroPie-Setup"
          chown -R "$REAL_USER:$REAL_USER" "$USER_HOME/RetroPie-Setup"
          cd "$USER_HOME/RetroPie-Setup"
          DEBIAN_FRONTEND=noninteractive ./retropie_packages.sh setup basic_install
          ./retropie_packages.sh emulationstation
          ./retropie_packages.sh retropiemenu
          /usr/local/bin/update_es_apps.sh

          apt-mark hold xserver-xorg-core xinit openbox xfce4-panel pcmanfm chromium 2>/dev/null || true

          mkdir -p /etc/apt/apt.conf.d
          cat << 'EOT' > /etc/apt/apt.conf.d/99kgamerapps
          DPkg::Post-Invoke {"/usr/local/bin/update_es_apps.sh";};
          EOT
          chattr +i /etc/apt/apt.conf.d/99kgamerapps

          # C. EmulationStation Çıkış ve Çoklu Dil Klavye Destekli Sistem Menüsü
          cat << 'EOT' > /usr/local/bin/kgamer_boot_menu.sh
          #!/bin/bash
          while true; do
              CHOICE=\$(whiptail --title "KGAMER-RETROGAMER SYSTEM MENU (OPENBOX X)" --menu "EmulationStation Quit Action / Select Mode:" 18 65 5 \
                  "1" "Return to EmulationStation" \
                  "2" "OPENBOX X Desktop GUI (Openbox + Bottom XFCE Panel)" \
                  "3" "RetroPie Setup Script" \
                  "4" "Modular Reinstall & Repair Menu" \
                  "5" "Change Keyboard Layout (All Languages)" 3>&1 1>&2 2>&3)

              exitstatus=\$?
              if [ \$exitstatus -ne 0 ]; then
                  emulationstation
                  continue
              fi

              case "\$CHOICE" in
                  "1")
                      emulationstation
                      ;;
                  "2")
                      xinit openbox -- :0
                      ;;
                  "3")
                      TARGET_HOME=\$(eval echo "~$(whoami)")
                      cd "\$TARGET_HOME/RetroPie-Setup" && ./retropie_setup.sh
                      ;;
                  "4")
                      /usr/local/bin/kgamer_retropie_reinstall.sh
                      ;;
                  "5")
                      KB_CHOICE=\$(whiptail --title "Select Keyboard Layout" --menu "Choose your keyboard layout:" 22 60 12 \
                          "us" "English (US)" \
                          "gb" "English (UK)" \
                          "tr" "Turkish (Türkçe Q)" \
                          "de" "German (Deutsch)" \
                          "fr" "French (Français)" \
                          "es" "Spanish (Español)" \
                          "it" "Italian (Italiano)" \
                          "pt" "Portuguese (Português)" \
                          "ru" "Russian (Русский)" \
                          "jp" "Japanese (日本語)" \
                          "kr" "Korean (한국어)" \
                          "cn" "Chinese (中文)" 3>&1 1>&2 2>&3)
                      
                      if [ \$? -eq 0 ] && [ ! -z "\$KB_CHOICE" ]; then
                          sudo localectl set-x11-keymap \$KB_CHOICE 2>/dev/null || true
                          case "\$KB_CHOICE" in
                              "tr") sudo loadkeys trq 2>/dev/null || true ;;
                              "ru") sudo loadkeys ru 2>/dev/null || true ;;
                              "de") sudo loadkeys de 2>/dev/null || true ;;
                              "fr") sudo loadkeys fr 2>/dev/null || true ;;
                              "es") sudo loadkeys es 2>/dev/null || true ;;
                              "it") sudo loadkeys it 2>/dev/null || true ;;
                              *) sudo loadkeys us 2>/dev/null || true ;;
                          esac
                          whiptail --title "Success" --msgbox "Keyboard layout successfully changed to \$KB_CHOICE!" 8 50
                      fi
                      ;;
              esac
          done
          EOT
          chmod +x /usr/local/bin/kgamer_boot_menu.sh
          chattr +i /usr/local/bin/kgamer_boot_menu.sh

          cat << 'EOT' > "$USER_HOME/.config/openbox/autostart"
          pcmanfm --desktop &
          picom -b &
          xfce4-panel &
          EOT

          echo 'while true; do /usr/local/bin/kgamer_boot_menu.sh; done' >> "$USER_HOME/.bashrc"

          # D. XFCE Panel Aşağı Açılan Menü ve Alt Konumlandırma
          cat << 'EOT' > "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="configversion" type="int" value="2"/>
            <property name="panels" type="array">
              <value type="int" value="1"/>
            </property>
            <property name="panel-1" type="empty">
              <property name="position" type="string" value="p=12;x=0;y=0"/>
              <property name="length" type="uint" value="100"/>
              <property name="position-locked" type="bool" value="true"/>
              <property name="size" type="uint" value="32"/>
              <property name="mode" type="uint" value="0"/>
              <property name="span-monitors" type="bool" value="true"/>
            </property>
          </channel>
          EOT

          # E. Tek Seferlik Güvenli Disk Genişletme Servisi
          cat << 'EOT' > /usr/local/bin/kgamer-expand.sh
          #!/bin/bash
          ROOT_PART=\$(findmnt / -o SOURCE -n)
          DISK_DEV=\$(echo "\$ROOT_PART" | sed 's/[0-9]*//g' | sed 's/p$//')
          PART_NUM=\$(echo "\$ROOT_PART" | grep -o '[0-9]*$')
          if [ -n "\$DISK_DEV" ] && [ -n "\$PART_NUM" ]; then
              parted --script "\$DISK_DEV" resizepart "\$PART_NUM" 100% || true
              resize2fs "\$ROOT_PART" || true
              systemctl disable kgamer-expand
              rm -f /etc/systemd/system/kgamer-expand.service
              rm -f /usr/local/bin/kgamer-expand.sh
          fi
          EOT
          chmod +x /usr/local/bin/kgamer-expand.sh

          cat << 'EOT' > /etc/systemd/system/kgamer-expand.service
          [Unit]
          Description=KGAMER-RETROGAMER Secure One-Time Auto-Expansion Service
          After=local-fs.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/kgamer-expand.sh
          [Install]
          WantedBy=multi-user.target
          EOT

          systemctl enable kgamer-expand.service
          chown -R "$REAL_USER:$REAL_USER" "$USER_HOME"
          EOF

          # Chroot içine girip kurulum betiğini çalıştır
          sudo chmod +x mnt/opt/kgamer/setup.sh
          sudo chroot mnt /opt/kgamer/setup.sh
          sudo rm -f mnt/opt/kgamer/setup.sh

      - name: Cleanup and Unmount IMG
        if: always()
        run: |
          # Güvenli unmount
          sudo umount mnt/proc 2>/dev/null || true
          sudo umount mnt/dev/pts 2>/dev/null || true
          sudo umount mnt/dev 2>/dev/null || true
          sudo umount mnt/sys 2>/dev/null || true
          sudo umount mnt 2>/dev/null || true
          
          # Loop cihazını serbest bırak
          LOOP_DEV=$(sudo losetup -j KGAMER-RETROGAMER.img | cut -d ':' -f1 | head -n 1)
          if [ -n "$LOOP_DEV" ]; then
              sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
          fi

      - name: Upload IMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGAMER-RETROGAMER
          path: KGAMER-RETROGAMER.img
