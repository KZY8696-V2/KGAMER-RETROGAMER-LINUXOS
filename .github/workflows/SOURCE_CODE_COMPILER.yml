name: Build KGAMER-RETROGAMER-LINUXOS Bootable .IMG Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize GitHub Runner Disk Space
        run: |
          echo "=== CLEANING RUNNER TO MAXIMIZE DISK SPACE ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /agent/_work/_tool
          sudo docker image prune --all --force || true
          df -h

      - name: Install Image Building Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted kpartx qemu-user-static wget curl unzip zip dosfstools exfat-fuse exfatprogs console-data e2fsprogs

      - name: Build and Embed into Raspberry Pi Lite Image
        run: |
          echo "=== KGAMER-RETROGAMER-LINUXOS .IMG BUILD STARTED ==="

          # 1. Resmi Raspberry Pi OS Lite Yerel İmajını İndir
          IMG_URL="https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz"
          
          echo "Downloading Raspberry Pi OS Lite local image..."
          wget -O raspios-lite.img.xz "$IMG_URL" || wget -O raspios-lite.img.xz "https://downloads.raspberrypi.org/raspios_lite_arm64/latest"
          
          if [[ "$(file -b raspios-lite.img.xz)" == *"XZ"* ]]; then
              unxz raspios-lite.img.xz
          else
              mv raspios-lite.img.xz raspios-lite.img
          fi

          IMG_FILE=$(ls *.img | head -n 1)
          echo "Image file: $IMG_FILE"

          # 2. İmaj Dosya Boyutunu +4 GB Genişlet (Tüm Paketlerin ve RetroPie'ın Sığması İçin)
          truncate -s +4G "$IMG_FILE"
          
          LOOP_DEV=$(sudo losetup --find --show "$IMG_FILE")
          sudo partx -a "$LOOP_DEV"
          sleep 3

          ROOT_PART="${LOOP_DEV}p2"
          BOOT_PART="${LOOP_DEV}p1"

          # Partition Tablosunu Büyüt ve ext4 Dosya Sistemini Genişlet
          sudo parted -s "$LOOP_DEV" resizepart 2 100%
          sudo e2fsck -f -p "$ROOT_PART" || true
          sudo resize2fs "$ROOT_PART"
          
          mkdir -p mnt
          sudo mount "$ROOT_PART" mnt
          sudo mkdir -p mnt/boot/firmware
          sudo mount "$BOOT_PART" mnt/boot/firmware

          # 3. Initramfs fsck Uyarısını Önlemek İçin Geçici fstab Tanımla
          sudo bash -c "echo '/dev/root / ext4 defaults,noatime 0 1' > mnt/etc/fstab"

          # 4. ARM64 Chroot için QEMU Statik Emülatörünü Kopyala
          sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/

          # 5. Orijinal Raspberry Pi Sihirbazlarını ve Servisleri KÖKTEN SİL
          sudo chroot mnt systemctl disable raspi-config 2>/dev/null || true
          sudo chroot mnt systemctl disable firstboot 2>/dev/null || true
          sudo chroot mnt systemctl disable resize2fs_once 2>/dev/null || true
          sudo rm -f mnt/etc/systemd/system/sysinit.target.wants/resize2fs_once.service 2>/dev/null || true
          sudo rm -f mnt/etc/profile.d/raspi-config.sh 2>/dev/null || true
          sudo rm -f mnt/boot/firstrun.sh 2>/dev/null || true

          # 6. Sabit 'kgamer' Kullanıcısını Manuel Oluştur ve Yetkilendir
          sudo chroot mnt bash -c "id -u kgamer &>/dev/null || useradd -m -s /bin/bash -G sudo,audio,video,input,games kgamer"
          sudo chroot mnt bash -c "echo 'kgamer:kgamer' | chpasswd"
          sudo chroot mnt bash -c "mkdir -p /home/kgamer && chown -R kgamer:kgamer /home/kgamer"

          # 7. Paket Kurulumları ve Git
          sudo chroot mnt apt-get update -y || true
          sudo chroot mnt apt-get install -y dialog git wget curl unzip xfce4-panel openbox console-setup plymouth plymouth-themes pcmanfm chromium || true
          sudo chroot mnt apt-get clean

          # 8. RetroPie'ı Doğrudan İmaj İçine Kur
          sudo chroot mnt bash -c "
            export DEBIAN_FRONTEND=noninteractive
            mkdir -p /opt/kgamer
            cd /opt/kgamer
            if [ ! -d \"RetroPie-Setup\" ]; then
                git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup || true
            fi
            cd RetroPie-Setup
            export YES=1
            ./retropie_packages.sh core setup_packages < /dev/null || true
            ./retropie_packages.sh essentials < /dev/null || true
            ./retropie_packages.sh emulationstation install < /dev/null || true
            ./retropie_packages.sh retroarch install < /dev/null || true
          " || true

          # 9. Otomatik Apps ve RPIGAMES Klasör Kısayollarını Oluştur
          sudo chroot mnt bash -c "
            mkdir -p /opt/kgamer/apps
            mkdir -p /opt/kgamer/backup_apps
            mkdir -p /home/kgamer/RetroPie/roms/apps
            mkdir -p /home/kgamer/RetroPie/roms/RPIGAMES
            mkdir -p /home/kgamer/RetroPie/roms/desktop-games

            cat << 'DESK' > /opt/kgamer/apps/terminal.desktop
[Desktop Entry]
Name=Terminal
Comment=System Command Line
Exec=bash
Icon=utilities-terminal
Terminal=true
Type=Application
Categories=Application;
DESK

            cat << 'DESK' > /opt/kgamer/apps/chromium.desktop
[Desktop Entry]
Name=Chromium Browser
Comment=Web Browser
Exec=chromium --no-sandbox
Icon=web-browser
Terminal=false
Type=Application
Categories=Network;
DESK

            cat << 'DESK' > /opt/kgamer/apps/pcmanfm.desktop
[Desktop Entry]
Name=File Manager (PCManFM)
Comment=Browse Files
Exec=pcmanfm
Icon=system-file-manager
Terminal=false
Type=Application
Categories=System;
DESK

            cp -f /opt/kgamer/apps/*.desktop /opt/kgamer/backup_apps/ 2>/dev/null || true
            rm -rf /home/kgamer/RetroPie/roms/apps/*
            ln -sf /opt/kgamer/apps/* /home/kgamer/RetroPie/roms/apps/ 2>/dev/null
            chown -R kgamer:kgamer /home/kgamer/RetroPie 2>/dev/null || true
          "

          # 10. Plymouth 30 FPS Blender Animasyonunu Göm
          THEME_DIR="mnt/usr/share/plymouth/themes/kgamer-boot"
          sudo mkdir -p "$THEME_DIR"
          
          if ls frame_0001.png 1> /dev/null 2>&1; then
              sudo cp frame_*.png "$THEME_DIR/"
              echo "Blender frames successfully embedded into image."
          else
              echo "ERROR: frame_0001.png not found directly in repository root!"
              exit 1
          fi

          sudo bash -c "cat << 'EOF' > $THEME_DIR/kgamer-boot.plymouth
          [Plymouth Theme]
          Name=KGAMER-RETROGAMER-LINUXOS 30FPS Boot
          Description=KGAMER-RETROGAMER-LINUXOS Blender 30 FPS Slideshow Theme
          ModuleName=slideshow

          [slideshow]
          ImageDir=/usr/share/plymouth/themes/kgamer-boot
          Duration=0.033
          ScriptFile=/usr/share/plymouth/themes/kgamer-boot/kgamer-boot.script
          EOF"

          sudo bash -c "cat << 'EOF' > $THEME_DIR/kgamer-boot.script
          screen_width = Window.GetWidth();
          screen_height = Window.GetHeight();

          counter = 1;
          max_frames = 150;

          fun load_frame(n) {
              if (n < 10) filename = \"frame_000\" + n + \".png\";
              else if (n < 100) filename = \"frame_00\" + n + \".png\";
              else filename = \"frame_0\" + n + \".png\";
              
              return Image(filename);
          }

          current_image = load_frame(counter);
          sprite = Sprite(current_image);
          sprite.SetX((screen_width - current_image.GetWidth()) / 2);
          sprite.SetY((screen_height - current_image.GetHeight()) / 2);

          fun refresh_callback () {
              counter++;
              if (counter > max_frames) {
                  counter = 1;
              }
              current_image = load_frame(counter);
              sprite.SetImage(current_image);
          }
          
          Plymouth.SetRefreshFunction(refresh_callback);
          EOF"

          sudo chroot mnt plymouth-set-default-theme -R kgamer-boot || true

          # 11. Kontrol Merkezi kgamer-setup.sh Betiğini Oluştur
          sudo mkdir -p mnt/opt/kgamer
          sudo bash -c "cat << 'EOF' > mnt/opt/kgamer/kgamer-setup.sh
          #!/bin/bash
          if [ \"\$EUID\" -ne 0 ]; then
            exit 1
          fi

          APPS_DIR=\"/opt/kgamer/apps\"
          BACKUP_APPS_DIR=\"/opt/kgamer/backup_apps\"

          configure_keyboard_layout() {
              KB_CHOICE=\$(dialog --clear --title \"KGAMER - KEYBOARD LAYOUT SELECTOR\" \
                  --menu \"Select your keyboard layout / country:\" 20 60 10 \
                  \"us\" \"English (US) - Standard QWERTY\" \
                  \"uk\" \"English (UK)\" \
                  \"tr\" \"Turkish (Q / F)\" \
                  \"de\" \"German (DE)\" \
                  \"fr\" \"French (FR)\" \
                  \"es\" \"Spanish (ES)\" \
                  \"it\" \"Italian (IT)\" \
                  \"br\" \"Portuguese (Brazil)\" \
                  \"jp\" \"Japanese (JP)\" \
                  \"other\" \"Other Layout (Manual Selection)\" 3>&1 1>&2 2>&3)

              if [ \"\$KB_CHOICE\" = \"other\" ]; then
                  CUSTOM_KB=\$(dialog --inputbox \"Enter keyboard layout code (e.g., us, tr, dk, fi):\" 8 50 \"us\" 3>&1 1>&2 2>&3)
                  [ -n \"\$CUSTOM_KB\" ] && KB_CHOICE=\"\$CUSTOM_KB\"
              fi

              if [ -n \"\$KB_CHOICE\" ]; then
                  localectl set-x11-keymap \"\$KB_CHOICE\" 2>/dev/null || true
                  loadkeys \"\$KB_CHOICE\" 2>/dev/null || true
                  dialog --msgbox \"Keyboard layout successfully updated to '\$KB_CHOICE'!\" 5 50
              fi
          }

          create_new_user_account() {
              NEW_USER=\$(dialog --inputbox \"Enter new username:\" 8 40 3>&1 1>&2 2>&3)
              if [ -n \"\$NEW_USER\" ]; then
                  NEW_PASS=\$(dialog --passwordbox \"Enter password for \$NEW_USER:\" 8 40 3>&1 1>&2 2>&3)
                  if [ -n \"\$NEW_PASS\" ]; then
                      useradd -m -s /bin/bash -G sudo,audio,video,input,games \"\$NEW_USER\" 2>/dev/null
                      echo \"\$NEW_USER:\$NEW_PASS\" | chpasswd
                      dialog --msgbox \"User '\$NEW_USER' created successfully!\" 5 45
                  fi
              fi
          }

          edit_existing_user() {
              TARGET_USER=\$(dialog --inputbox \"Enter existing username to edit (e.g., kgamer):\" 8 50 \"kgamer\" 3>&1 1>&2 2>&3)
              if id \"\$TARGET_USER\" &>/dev/null; then
                  ACTION=\$(dialog --clear --title \"Edit User: \$TARGET_USER\" \
                      --menu \"Select option:\" 12 50 2 \
                      \"1\" \"Change Username\" \
                      \"2\" \"Change Password\" 3>&1 1>&2 2>&3)
                  
                  if [ \"\$ACTION\" = \"1\" ]; then
                      NEW_NAME=\$(dialog --inputbox \"Enter new username for \$TARGET_USER:\" 8 50 3>&1 1>&2 2>&3)
                      if [ -n \"\$NEW_NAME\" ]; then
                          usermod -l \"\$NEW_NAME\" \"\$TARGET_USER\" 2>/dev/null
                          dialog --msgbox \"Username changed to '\$NEW_NAME' successfully!\" 5 50
                      fi
                  elif [ \"\$ACTION\" = \"2\" ]; then
                      NEW_P=\$(dialog --passwordbox \"Enter new password for \$TARGET_USER:\" 8 50 3>&1 1>&2 2>&3)
                      if [ -n \"\$NEW_P\" ]; then
                          echo \"\$TARGET_USER:\$NEW_P\" | chpasswd
                          dialog --msgbox \"Password updated successfully!\" 5 40
                      fi
                  fi
              else
                  dialog --msgbox \"User '\$TARGET_USER' not found!\" 5 40
              fi
          }

          change_root_password() {
              ROOT_P=\$(dialog --passwordbox \"Enter new ROOT password:\" 8 50 3>&1 1>&2 2>&3)
              if [ -n \"\$ROOT_P\" ]; then
                  echo \"root:\$ROOT_P\" | chpasswd
                  dialog --msgbox \"Root password updated successfully!\" 5 45
              fi
          }

          if [ ! -f \"/opt/kgamer/.keyboard_configured\" ]; then
              configure_keyboard_layout
              touch \"/opt/kgamer/.keyboard_configured\"
          fi

          while true; do
              if [ ! -f \"\$APPS_DIR/terminal.desktop\" ]; then
                  mkdir -p \"\$APPS_DIR\"
                  cp -f \"\$BACKUP_APPS_DIR\"/*.desktop \"\$APPS_DIR/\" 2>/dev/null || true
              fi

              CHOICE=\$(dialog --clear --title \"KGAMER-RETROGAMER-LINUXOS CONTROL CENTER\" \
                  --menu \"Select action:\" 18 65 7 \
                  \"1\" \"RETURN TO EMULATION STATION\" \
                  \"2\" \"Open GUI Desktop (Openbox & XFCE Panel)\" \
                  \"3\" \"Change Keyboard Layout\" \
                  \"4\" \"Create New User Account\" \
                  \"5\" \"Edit Existing User (Name/Password)\" \
                  \"6\" \"Change Root Password\" \
                  \"7\" \"Exit / Shutdown\" 3>&1 1>&2 2>&3)
              case \$CHOICE in
                  1) clear; emulationstation ;;
                  2) clear; xfce4-panel & openbox-session ;;
                  3) configure_keyboard_layout ;;
                  4) create_new_user_account ;;
                  5) edit_existing_user ;;
                  6) change_root_password ;;
                  7) clear; exit 0 ;;
              esac
          done
          EOF"

          sudo chmod +x mnt/opt/kgamer/kgamer-setup.sh

          # 12. Systemd First-Boot Service Tanımlaması
          sudo bash -c "cat << 'EOF' > mnt/etc/systemd/system/kgamer-setup.service
          [Unit]
          Description=KGAMER-RETROGAMER-LINUXOS First Boot Auto Setup
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/bin/bash /opt/kgamer/kgamer-setup.sh
          StandardInput=tty
          StandardOutput=tty
          TTYPath=/dev/tty1

          [Install]
          WantedBy=multi-user.target
          EOF"

          sudo chroot mnt systemctl enable kgamer-setup.service

          # 13. Geçici QEMU Dosyasını Temizle ve Unmount Et
          sudo rm -f mnt/usr/bin/qemu-aarch64-static
          sudo sync
          sudo umount mnt/boot/firmware || true
          sudo umount mnt || true
          sudo partx -d "$LOOP_DEV"
          sudo losetup -d "$LOOP_DEV"

          mv "$IMG_FILE" KGAMER-RETROGAMER-LINUXOS.img
          zip KGAMER-RETROGAMER-LINUXOS.img.zip KGAMER-RETROGAMER-LINUXOS.img

      - name: Upload Final Bootable .IMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGAMER-RETROGAMER-LINUXOS-IMG
          path: KGAMER-RETROGAMER-LINUXOS.img.zip
