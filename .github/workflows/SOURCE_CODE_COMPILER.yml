name: Build KGAMER-RETROGAMER-LINUXOS Bootable .IMG Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rpi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Image Building Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted kpartx qemu-user-static wget curl unzip zip dosfstools exfat-fuse exfatprogs console-data e2fsprogs psmisc

      - name: Build and Embed into Raspberry Pi Lite Image
        run: |
          echo "=== KGAMER-RETROGAMER-LINUXOS .IMG BUILD STARTED ==="

          IMG_URL="https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz"
          
          wget -O raspios-lite.img.xz "$IMG_URL" || wget -O raspios-lite.img.xz "https://downloads.raspberrypi.org/raspios_lite_arm64/latest"
          
          if [[ "$(file -b raspios-lite.img.xz)" == *"XZ"* ]]; then
              unxz raspios-lite.img.xz
          else
              mv raspios-lite.img.xz raspios-lite.img
          fi

          IMG_FILE=$(ls *.img | head -n 1)
          truncate -s +4G "$IMG_FILE"
          
          LOOP_DEV=$(sudo losetup --find --show "$IMG_FILE")
          sudo partx -a "$LOOP_DEV"
          sleep 3

          ROOT_PART="${LOOP_DEV}p2"
          BOOT_PART="${LOOP_DEV}p1"

          sudo parted -s "$LOOP_DEV" resizepart 2 100%
          sudo e2fsck -f -p "$ROOT_PART" || true
          sudo resize2fs "$ROOT_PART"
          
          mkdir -p mnt
          sudo mount "$ROOT_PART" mnt
          sudo mkdir -p mnt/boot/firmware
          sudo mount "$BOOT_PART" mnt/boot/firmware

          sudo mount -t proc proc mnt/proc
          sudo mount -t sysfs sysfs mnt/sys
          sudo mount --bind /dev mnt/dev
          sudo mount --bind /dev/pts mnt/dev/pts

          sudo bash -c "echo '/dev/root / ext4 defaults,noatime 0 1' > mnt/etc/fstab"
          sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/

          sudo chroot mnt systemctl disable raspi-config 2>/dev/null || true
          sudo chroot mnt systemctl disable firstboot 2>/dev/null || true
          sudo chroot mnt systemctl disable resize2fs_once 2>/dev/null || true

          sudo chroot mnt useradd -m -s /bin/bash -G sudo,audio,video,input,games kgamer 2>/dev/null || true
          sudo chroot mnt bash -c "echo 'kgamer:kgamer' | chpasswd"
          sudo chroot mnt mkdir -p /home/kgamer
          sudo chroot mnt chown -R kgamer:kgamer /home/kgamer

          sudo chroot mnt apt-get update -y || true
          sudo chroot mnt apt-get install -y dialog git wget curl unzip xfce4-panel openbox console-setup pcmanfm chromium || true

          if [ -f "bee-gold-collector-hero-edition_arm64.deb" ]; then
              sudo cp bee-gold-collector-hero-edition_arm64.deb mnt/tmp/
              sudo chroot mnt apt-get install -y /tmp/bee-gold-collector-hero-edition_arm64.deb || sudo chroot mnt dpkg -i /tmp/bee-gold-collector-hero-edition_arm64.deb || true
              sudo chroot mnt apt-get install -f -y || true
              sudo rm -f mnt/tmp/bee-gold-collector-hero-edition_arm64.deb
          fi

          sudo chroot mnt apt-get clean

          # --- RETROPIE KURULUMU ---
          sudo chroot mnt mkdir -p /opt/kgamer
          sudo chroot mnt bash -c "export USER=root; export DEBIAN_FRONTEND=noninteractive; cd /opt/kgamer && [ ! -d RetroPie-Setup ] && git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git RetroPie-Setup || true"
          sudo chroot mnt bash -c "export USER=root; export DEBIAN_FRONTEND=noninteractive; export YES=1; cd /opt/kgamer/RetroPie-Setup && ./retropie_packages.sh core setup_packages || true"
          sudo chroot mnt bash -c "export USER=root; export DEBIAN_FRONTEND=noninteractive; export YES=1; cd /opt/kgamer/RetroPie-Setup && ./retropie_packages.sh essentials || true"
          sudo chroot mnt bash -c "export USER=root; export DEBIAN_FRONTEND=noninteractive; export YES=1; cd /opt/kgamer/RetroPie-Setup && ./retropie_packages.sh emulationstation install || true"
          sudo chroot mnt bash -c "export USER=root; export DEBIAN_FRONTEND=noninteractive; export YES=1; cd /opt/kgamer/RetroPie-Setup && ./retropie_packages.sh retroarch install || true"

          # --- DİZİNLER ---
          sudo mkdir -p mnt/home/kgamer/RetroPie/roms/kgamer-games
          sudo mkdir -p mnt/home/kgamer/RetroPie/roms/games
          sudo mkdir -p mnt/home/kgamer/RetroPie/roms/apps
          sudo mkdir -p mnt/opt/kgamer/apps
          sudo mkdir -p mnt/opt/kgamer/backup_apps
          sudo mkdir -p mnt/etc/emulationstation

          # 1. KGAMER CONTROL CENTER Scripti Oluşturma ve Kopyalama
          cat << 'EOF' > kgamer-setup.sh
#!/bin/bash
if [ "$EUID" -ne 0 ]; then
  exit 1
fi
killall emulationstation 2>/dev/null || true
pkill -f emulationstation 2>/dev/null || true
APPS_DIR="/opt/kgamer/apps"
BACKUP_APPS_DIR="/opt/kgamer/backup_apps"
configure_keyboard_layout() {
    KB_CHOICE=$(dialog --clear --title "KGAMER - KEYBOARD LAYOUT SELECTOR" --menu "Select your keyboard layout / country:" 20 60 11 "us" "English (US) - Standard QWERTY" "uk" "English (UK)" "tr" "Turkish (Q / F Choice)" "de" "German (DE - QWERTZ)" "fr" "French (FR - AZERTY)" "es" "Spanish (ES)" "it" "Italian (IT)" "br" "Portuguese (Brazil)" "jp" "Japanese (JP)" "other" "Other Layout (Manual Code)" 3>&1 1>&2 2>&3)
    if [ "$KB_CHOICE" = "tr" ]; then
        TR_VARIANT=$(dialog --clear --title "TURKISH KEYBOARD VARIANT" --menu "Select Turkish keyboard type:" 10 50 2 "q" "Turkish Q Klavye" "f" "Turkish F Klavye" 3>&1 1>&2 2>&3)
        if [ "$TR_VARIANT" = "f" ]; then
            KB_CHOICE="tr"
            VARIANT_ARG="f"
        else
            KB_CHOICE="tr"
            VARIANT_ARG="q"
        fi
    elif [ "$KB_CHOICE" = "other" ]; then
        CUSTOM_KB=$(dialog --inputbox "Enter keyboard layout code (e.g., us, tr, dk, fi):" 8 50 "us" 3>&1 1>&2 2>&3)
        [ -n "$CUSTOM_KB" ] && KB_CHOICE="$CUSTOM_KB"
    fi
    if [ -n "$KB_CHOICE" ]; then
        if [ "$KB_CHOICE" = "tr" ] && [ "$VARIANT_ARG" = "f" ]; then
            localectl set-x11-keymap tr pc105 f 2>/dev/null || true
            loadkeys trf 2>/dev/null || true
            dialog --msgbox "Keyboard layout successfully updated to Turkish F!" 5 50
        else
            localectl set-x11-keymap "$KB_CHOICE" 2>/dev/null || true
            loadkeys "$KB_CHOICE" 2>/dev/null || true
            dialog --msgbox "Keyboard layout successfully updated to '$KB_CHOICE'!" 5 50
        fi
    fi
}
create_new_user_account() {
    NEW_USER=$(dialog --inputbox "Enter new username:" 8 40 3>&1 1>&2 2>&3)
    if [ -n "$NEW_USER" ]; then
        NEW_PASS=$(dialog --passwordbox "Enter password for $NEW_USER:" 8 40 3>&1 1>&2 2>&3)
        if [ -n "$NEW_PASS" ]; then
            useradd -m -s /bin/bash -G sudo,audio,video,input,games "$NEW_USER" 2>/dev/null
            echo "$NEW_USER:$NEW_PASS" | chpasswd
            dialog --msgbox "User '$NEW_USER' created successfully!" 5 45
        fi
    fi
}
edit_existing_user() {
    TARGET_USER=$(dialog --inputbox "Enter existing username to edit (e.g., kgamer):" 8 50 "kgamer" 3>&1 1>&2 2>&3)
    if id "$TARGET_USER" &>/dev/null; then
        ACTION=$(dialog --clear --title "Edit User: $TARGET_USER" --menu "Select option:" 12 50 2 "1" "Change Username" "2" "Change Password" 3>&1 1>&2 2>&3)
        if [ "$ACTION" = "1" ]; then
            NEW_NAME=$(dialog --inputbox "Enter new username for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
            if [ -n "$NEW_NAME" ]; then
                usermod -l "$NEW_NAME" "$TARGET_USER" 2>/dev/null
                dialog --msgbox "Username changed to '$NEW_NAME' successfully!" 5 50
            fi
        elif [ "$ACTION" = "2" ]; then
            NEW_P=$(dialog --passwordbox "New password for $TARGET_USER:" 8 50 3>&1 1>&2 2>&3)
            if [ -n "$NEW_P" ]; then
                echo "$TARGET_USER:$NEW_P" | chpasswd
                dialog --msgbox "Password updated successfully!" 5 40
            fi
        fi
    else
        dialog --msgbox "User '$TARGET_USER' not found!" 5 40
    fi
}
change_root_password() {
    ROOT_P=$(dialog --passwordbox "Enter new ROOT password:" 8 50 3>&1 1>&2 2>&3)
    if [ -n "$ROOT_P" ]; then
        echo "root:$ROOT_P" | chpasswd
        dialog --msgbox "Root password updated successfully!" 5 45
    fi
}
if [ ! -f "/opt/kgamer/.keyboard_configured" ]; then
    configure_keyboard_layout
    touch "/opt/kgamer/.keyboard_configured"
fi
while true; do
    if [ ! -f "$APPS_DIR/terminal.desktop" ]; then
        mkdir -p "$APPS_DIR"
        cp -f "$BACKUP_APPS_DIR"/*.desktop "$APPS_DIR/" 2>/dev/null || true
    fi
    CHOICE=$(dialog --clear --title "KGAMER-RETROGAMER-LINUXOS CONTROL CENTER" --menu "Select action:" 18 65 7 "1" "RETURN TO EMULATION STATION" "2" "Open GUI Desktop (Openbox & XFCE Panel)" "3" "Change Keyboard Layout" "4" "Create New User Account" "5" "Edit Existing User (Name/Password)" "6" "Change Root Password" "7" "Exit / Shutdown" 3>&1 1>&2 2>&3)
    case $CHOICE in
        1) clear; su - kgamer -c "emulationstation" & exit 0 ;;
        2) clear; xfce4-panel & openbox-session ;;
        3) configure_keyboard_layout ;;
        4) create_new_user_account ;;
        5) edit_existing_user ;;
        6) change_root_password ;;
        7) clear; exit 0 ;;
    esac
done
EOF
          sudo cp kgamer-setup.sh mnt/opt/kgamer/kgamer-setup.sh
          sudo chmod +x mnt/opt/kgamer/kgamer-setup.sh

          # 2. EmulationStation Başlatıcıları ve Menü Dosyaları
          cat << 'EOF' > KGAMER-CONTROL-CENTER.sh
#!/bin/bash
/opt/kgamer/kgamer-setup.sh
EOF
          sudo cp KGAMER-CONTROL-CENTER.sh mnt/home/kgamer/RetroPie/roms/kgamer-games/KGAMER-CONTROL-CENTER.sh
          sudo chmod +x mnt/home/kgamer/RetroPie/roms/kgamer-games/KGAMER-CONTROL-CENTER.sh

          cat << 'EOF' > KGAMER.desktop
[Desktop Entry]
Type=Application
Name=KGAMER GAMEBOX
Comment=KGAMER Retro Gamer Operating System Launcher
Exec=/opt/kgamer/kgamer-setup.sh
Icon=gamepad
Terminal=true
Categories=Game;
EOF
          sudo cp KGAMER.desktop mnt/home/kgamer/RetroPie/roms/kgamer-games/KGAMER.desktop
          sudo chmod +x mnt/home/kgamer/RetroPie/roms/kgamer-games/KGAMER.desktop

          cat << 'EOF' > Bee-Gold-Collector.desktop
[Desktop Entry]
Type=Application
Name=Bee Gold Collector Hero Edition
Comment=Bee Gold Collector Game
Exec=bee-gold-collector
Icon=gamepad
Terminal=false
Categories=Game;
EOF
          sudo cp Bee-Gold-Collector.desktop mnt/home/kgamer/RetroPie/roms/games/Bee-Gold-Collector.desktop
          sudo chmod +x mnt/home/kgamer/RetroPie/roms/games/Bee-Gold-Collector.desktop

          # 3. Uygulamalar (.desktop)
          cat << 'EOF' > terminal.desktop
[Desktop Entry]
Name=Terminal
Comment=System Command Line
Exec=bash
Icon=utilities-terminal
Terminal=true
Type=Application
Categories=Application;
EOF
          sudo cp terminal.desktop mnt/opt/kgamer/apps/

          cat << 'EOF' > chromium.desktop
[Desktop Entry]
Name=Chromium Browser
Comment=Web Browser
Exec=chromium --no-sandbox
Icon=web-browser
Terminal=false
Type=Application
Categories=Network;
EOF
          sudo cp chromium.desktop mnt/opt/kgamer/apps/

          cat << 'EOF' > pcmanfm.desktop
[Desktop Entry]
Name=File Manager (PCManFM)
Comment=Browse Files
Exec=pcmanfm
Icon=system-file-manager
Terminal=false
Type=Application
Categories=System;
EOF
          sudo cp pcmanfm.desktop mnt/opt/kgamer/apps/

          sudo cp -f mnt/opt/kgamer/apps/*.desktop mnt/opt/kgamer/backup_apps/ 2>/dev/null || true
          sudo ln -sf /opt/kgamer/apps/terminal.desktop mnt/home/kgamer/RetroPie/roms/apps/
          sudo ln -sf /opt/kgamer/apps/chromium.desktop mnt/home/kgamer/RetroPie/roms/apps/
          sudo ln -sf /opt/kgamer/apps/pcmanfm.desktop mnt/home/kgamer/RetroPie/roms/apps/

          # 4. EmulationStation Yapılandırması (es_systems.cfg)
          cat << 'EOF' > es_systems.cfg
<systemList>
  <system>
    <name>kgamer-games</name>
    <fullname>KGAMER GAMES</fullname>
    <path>/home/kgamer/RetroPie/roms/kgamer-games</path>
    <extension>.sh .SH .desktop .DESKTOP</extension>
    <command>%ROM%</command>
    <platform>pc</platform>
    <theme>kgamer-games</theme>
  </system>
  <system>
    <name>games</name>
    <fullname>GAMES</fullname>
    <path>/home/kgamer/RetroPie/roms/games</path>
    <extension>.sh .SH .bin .elf .zip .ZIP .desktop .DESKTOP</extension>
    <command>%ROM%</command>
    <platform>pc</platform>
    <theme>games</theme>
  </system>
  <system>
    <name>apps</name>
    <fullname>UYGULAMALAR (APPS)</fullname>
    <path>/home/kgamer/RetroPie/roms/apps</path>
    <extension>.desktop .DESKTOP .sh .SH</extension>
    <command>gtk-launch $(basename %ROM% .desktop) || %ROM%</command>
    <platform>pc</platform>
    <theme>ports</theme>
  </system>
</systemList>
EOF
          sudo cp es_systems.cfg mnt/etc/emulationstation/es_systems.cfg

          # 5. Systemd Servisi
          cat << 'EOF' > kgamer-setup.service
[Unit]
Description=KGAMER-RETROGAMER-LINUXOS First Boot Auto Setup
After=network-online.target

[Service]
Type=simple
ExecStart=/bin/bash /opt/kgamer/kgamer-setup.sh
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/tty1

[Install]
WantedBy=multi-user.target
EOF
          sudo cp kgamer-setup.service mnt/etc/systemd/system/kgamer-setup.service

          sudo chroot mnt systemctl enable kgamer-setup.service
          sudo chown -R kgamer:kgamer mnt/home/kgamer 2>/dev/null || true

          sudo rm -f mnt/usr/bin/qemu-aarch64-static
          sudo sync

          sudo umount mnt/dev/pts || true
          sudo umount mnt/dev || true
          sudo umount mnt/sys || true
          sudo umount mnt/proc || true
          sudo umount mnt/boot/firmware || true
          sudo umount mnt || true

          sudo partx -d "$LOOP_DEV"
          sudo losetup -d "$LOOP_DEV"

          mv "$IMG_FILE" KGAMER-RETROGAMER-LINUXOS.img
          zip KGAMER-RETROGAMER-LINUXOS.img.zip KGAMER-RETROGAMER-LINUXOS.img

      - name: Upload Final Bootable .IMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGAMER-RETROGAMER-LINUXOS-IMG
          path: KGAMER-RETROGAMER-LINUXOS.img.zipome/kgamer/RetroPie/roms/games/Bee-Gold-Collector.desktop

          # 3. Uygulamalar (.desktop)
          sudo tee mnt/opt/kgamer/apps/terminal.desktop << 'EOF' > /dev/null
[Desktop Entry]
Name=Terminal
Comment=System Command Line
Exec=bash
Icon=utilities-terminal
Terminal=true
Type=Application
Categories=Application;
EOF

          sudo tee mnt/opt/kgamer/apps/chromium.desktop << 'EOF' > /dev/null
[Desktop Entry]
Name=Chromium Browser
Comment=Web Browser
Exec=chromium --no-sandbox
Icon=web-browser
Terminal=false
Type=Application
Categories=Network;
EOF

          sudo tee mnt/opt/kgamer/apps/pcmanfm.desktop << 'EOF' > /dev/null
[Desktop Entry]
Name=File Manager (PCManFM)
Comment=Browse Files
Exec=pcmanfm
Icon=system-file-manager
Terminal=false
Type=Application
Categories=System;
EOF

          sudo cp -f mnt/opt/kgamer/apps/*.desktop mnt/opt/kgamer/backup_apps/ 2>/dev/null || true
          sudo ln -sf /opt/kgamer/apps/terminal.desktop mnt/home/kgamer/RetroPie/roms/apps/
          sudo ln -sf /opt/kgamer/apps/chromium.desktop mnt/home/kgamer/RetroPie/roms/apps/
          sudo ln -sf /opt/kgamer/apps/pcmanfm.desktop mnt/home/kgamer/RetroPie/roms/apps/

          # 4. EmulationStation Yapılandırması (es_systems.cfg)
          sudo tee mnt/etc/emulationstation/es_systems.cfg << 'EOF' > /dev/null
<systemList>
  <system>
    <name>kgamer-games</name>
    <fullname>KGAMER GAMES</fullname>
    <path>/home/kgamer/RetroPie/roms/kgamer-games</path>
    <extension>.sh .SH .desktop .DESKTOP</extension>
    <command>%ROM%</command>
    <platform>pc</platform>
    <theme>kgamer-games</theme>
  </system>
  <system>
    <name>games</name>
    <fullname>GAMES</fullname>
    <path>/home/kgamer/RetroPie/roms/games</path>
    <extension>.sh .SH .bin .elf .zip .ZIP .desktop .DESKTOP</extension>
    <command>%ROM%</command>
    <platform>pc</platform>
    <theme>games</theme>
  </system>
  <system>
    <name>apps</name>
    <fullname>UYGULAMALAR (APPS)</fullname>
    <path>/home/kgamer/RetroPie/roms/apps</path>
    <extension>.desktop .DESKTOP .sh .SH</extension>
    <command>gtk-launch $(basename %ROM% .desktop) || %ROM%</command>
    <platform>pc</platform>
    <theme>ports</theme>
  </system>
</systemList>
EOF

          # 5. Systemd Servisi
          sudo tee mnt/etc/systemd/system/kgamer-setup.service << 'EOF' > /dev/null
[Unit]
Description=KGAMER-RETROGAMER-LINUXOS First Boot Auto Setup
After=network-online.target

[Service]
Type=simple
ExecStart=/bin/bash /opt/kgamer/kgamer-setup.sh
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/tty1

[Install]
WantedBy=multi-user.target
EOF

          sudo chroot mnt systemctl enable kgamer-setup.service
          sudo chown -R kgamer:kgamer mnt/home/kgamer 2>/dev/null || true

          sudo rm -f mnt/usr/bin/qemu-aarch64-static
          sudo sync

          sudo umount mnt/dev/pts || true
          sudo umount mnt/dev || true
          sudo umount mnt/sys || true
          sudo umount mnt/proc || true
          sudo umount mnt/boot/firmware || true
          sudo umount mnt || true

          sudo partx -d "$LOOP_DEV"
          sudo losetup -d "$LOOP_DEV"

          mv "$IMG_FILE" KGAMER-RETROGAMER-LINUXOS.img
          zip KGAMER-RETROGAMER-LINUXOS.img.zip KGAMER-RETROGAMER-LINUXOS.img

      - name: Upload Final Bootable .IMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGAMER-RETROGAMER-LINUXOS-IMG
          path: KGAMER-RETROGAMER-LINUXOS.img.zip
